<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon Lander</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>:root{--a:#ffd23f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05060f;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(94vw,480px);border-radius:14px;background:#02030a;touch-action:none;border:1px solid #ffffff22}</style>
<main><h1>MOON LANDER</h1><canvas id="c" width="480" height="520"></canvas><p>↑ / W thrust · ← → / A D rotate (or hold the screen to thrust). Land gently and upright on the pad!</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),K={};let L,pad,sc=0,st='ready',best=0,fuel,msg='',S=Array.from({length:60},()=>[Math.random()*480,Math.random()*300,Math.random()*1.5]);
function nw(){L={x:240,y:60,vx:Math.random()*2-1,vy:0,a:0};pad=40+Math.random()*320;fuel=100;st='play'}
onkeydown=e=>{K[e.key]=1;if(['ArrowUp','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(st!='play'){if(st=='over')sc=0;nw()}};onkeyup=e=>K[e.key]=0;c.onpointerdown=()=>{K.t=1;if(st!='play'){if(st=='over')sc=0;nw()}};c.onpointerup=()=>K.t=0;
(function f(){if(st=='play'){L.vy+=.025;if(K.ArrowLeft||K.a)L.a-=.04;if(K.ArrowRight||K.d)L.a+=.04;if((K.ArrowUp||K.w||K.t)&&fuel>0){L.vx+=Math.sin(L.a)*.07;L.vy-=Math.cos(L.a)*.07;fuel-=.25}L.x+=L.vx;L.y+=L.vy;if(L.x<0)L.x=480;if(L.x>480)L.x=0;
if(L.y>470){const ok=Math.abs(L.vx)<1.2&&L.vy<1.8&&Math.abs(L.a)<.35&&L.x>pad&&L.x<pad+90;if(ok){sc++;best=Math.max(best,sc);window.Hub&&Hub.score('lander',sc);msg='Perfect landing!';st='ready'}else{msg='Crashed!';st='over'}}}
x.fillStyle='#02030a';x.fillRect(0,0,480,520);x.fillStyle='#fff';S.forEach(s=>x.fillRect(s[0],s[1],s[2],s[2]));x.fillStyle='#555';x.fillRect(0,490,480,30);x.fillStyle='#6dff9a';x.fillRect(pad||0,486,90,6);
if(L){x.save();x.translate(L.x,L.y);x.rotate(L.a);x.fillStyle='#ddd';x.beginPath();x.moveTo(0,-18);x.lineTo(13,14);x.lineTo(-13,14);x.closePath();x.fill();if((K.ArrowUp||K.w||K.t)&&fuel>0&&st=='play'){x.fillStyle='#ff9f43';x.beginPath();x.moveTo(-6,14);x.lineTo(0,30+Math.random()*10);x.lineTo(6,14);x.fill()}x.restore()}
x.fillStyle='#fff';x.font='bold 18px system-ui';x.textAlign='left';x.fillText('Landings '+sc+' · best '+best,12,26);x.fillStyle='#333';x.fillRect(12,38,100,8);x.fillStyle=fuel>25?'#6dff9a':'#ff5d73';x.fillRect(12,38,Math.max(0,fuel),8);
if(L&&st=='play'){x.font='13px system-ui';x.fillText('speed '+Math.hypot(L.vx,L.vy).toFixed(1),12,64)}
if(st!='play'){x.textAlign='center';x.fillStyle='#000a';x.fillRect(0,200,480,110);x.fillStyle='#fff';x.font='bold 28px system-ui';x.fillText(msg||'Moon Lander',240,248);x.font='15px system-ui';x.fillText('Press any key or tap to '+(st=='over'?'retry':'go'),240,280)}requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
