<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lava Lamp</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫠</text></svg>">
<style>:root{--a:#ff8a5c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12041c;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(94vw,420px);aspect-ratio:2/3;border-radius:60px 60px 30px 30px;image-rendering:auto;cursor:pointer;border:6px solid #2a1236;box-shadow:0 0 60px #ff4f9a55}</style>
<main><h1>LAVA LAMP</h1><canvas id="c" width="100" height="150"></canvas><p>Click the lamp to change its colors · it keeps flowing forever.</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),W=100,H=150,img=x.createImageData(W,H),R=(a,b)=>a+Math.random()*(b-a);let hue=15,t=0;
const B=Array.from({length:8},()=>({x:R(20,80),y:R(20,130),vx:R(-.1,.1),vy:R(-.25,.25),r:R(9,17)}));
c.onclick=()=>hue=(hue+55)%360;
const hsl=(h,s,l)=>{s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return[f(0),f(8),f(4)]};
(function f(){t+=.01;B.forEach(b=>{b.x+=b.vx+Math.sin(t+b.r)*.08;b.y+=b.vy;if(b.y<b.r){b.vy=Math.abs(b.vy)}if(b.y>H-b.r){b.vy=-Math.abs(b.vy)}if(b.x<b.r||b.x>W-b.r)b.vx*=-1;b.vy+=(b.y<H*.5?.004:-.004)*(Math.random()<.5?1:-1)+(b.y>H*.6?-.003:.003)});
let p=0;for(let j=0;j<H;j++)for(let i=0;i<W;i++){let v=0;for(const b of B){const dx=i-b.x,dy=j-b.y;v+=b.r*b.r/(dx*dx+dy*dy+1)}
const k=Math.min(1,Math.max(0,(v-.9)*1.3)),bgc=hsl(hue+300,60,10+j/H*8),fg=hsl(hue+k*45,95,45+k*25),m=v>1?1:0,col=m?fg:bgc;img.data[p++]=col[0];img.data[p++]=col[1];img.data[p++]=col[2];img.data[p++]=255}
x.putImageData(img,0,0);requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
