<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Warp</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌠</text></svg>">
<style>:root{--a:#7cf}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>body{display:block}canvas{position:fixed;inset:0}#ui{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:2;background:#000a;padding:8px 16px;border-radius:24px;border:1px solid #ffffff33;font-size:14px}input{accent-color:#7cf}</style>
<canvas id="c"></canvas><div id="ui">Warp speed <input id="sp" type="range" min="1" max="40" value="12"> · move the mouse to steer</div>
<script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,mx=0,my=0;const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();onresize=rs;
const S=Array.from({length:500},()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()}));onpointermove=e=>{mx=(e.clientX/W-.5)*2;my=(e.clientY/H-.5)*2};
(function f(){const v=+document.getElementById('sp').value/1000;x.fillStyle='rgba(0,0,8,.35)';x.fillRect(0,0,W,H);S.forEach(s=>{const pz=s.z;s.z-=v;s.x-=mx*.004;s.y-=my*.004;if(s.z<=.01||Math.abs(s.x/s.z)>2||Math.abs(s.y/s.z)>2){s.x=Math.random()*2-1;s.y=Math.random()*2-1;s.z=1;return}
const X=W/2+s.x/s.z*W*.35,Y=H/2+s.y/s.z*H*.35,PX=W/2+s.x/pz*W*.35,PY=H/2+s.y/pz*H*.35,b=1-s.z;x.strokeStyle=`hsl(${200+b*60},100%,${60+b*35}%)`;x.lineWidth=.5+b*2.5;x.beginPath();x.moveTo(PX,PY);x.lineTo(X,Y);x.stroke()});requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
