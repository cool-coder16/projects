<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lane Dodge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚧</text></svg>">
<style>:root{--a:#ff9f43}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#141a24;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(80vw,300px);border-radius:14px;touch-action:none;border:1px solid #ffffff22}</style>
<main><h1>LANE DODGE</h1><canvas id="c" width="300" height="520"></canvas><p>← → / A D or tap the left/right side to switch lanes. Dodge the blocks!</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d');let ln=1,O=[],sc=0,st='ready',best=0,t=0,sp=4,off=0;
function go(d){if(st!='play'){O=[];ln=1;sc=0;t=0;sp=4;st='play';return}ln=Math.max(0,Math.min(2,ln+d))}
onkeydown=e=>{if(e.key=='ArrowLeft'||e.key=='a')go(-1);if(e.key=='ArrowRight'||e.key=='d')go(1)};c.onpointerdown=e=>{const r=c.getBoundingClientRect();go((e.clientX-r.left)/r.width<.5?-1:1)};
(function f(){if(st=='play'){t++;sp=4+t/500;sc=Math.floor(t/6);off=(off+sp)%40;if(t%Math.max(18,50-Math.floor(t/90))==0){const n=Math.random()<.3?2:1,free=Math.floor(Math.random()*3);for(let l=0;l<3;l++)if(l!=free&&(n==2||l==(free+1)%3))O.push({l,y:-40})}
O.forEach(o=>o.y+=sp);O=O.filter(o=>o.y<560);if(O.some(o=>o.l==ln&&o.y>430&&o.y<500)){st='over';best=Math.max(best,sc);window.Hub&&Hub.score('lanedodge',sc)}}
x.fillStyle='#141a24';x.fillRect(0,0,300,520);x.fillStyle='#ffffff22';for(let i=-1;i<14;i++){x.fillRect(100-2,i*40+off,4,20);x.fillRect(200-2,i*40+off,4,20)}
O.forEach(o=>{x.fillStyle='#ff9f43';x.shadowColor='#ff9f43';x.shadowBlur=10;x.fillRect(o.l*100+14,o.y,72,36);x.shadowBlur=0});x.fillStyle='#4dd0ff';x.shadowColor='#4dd0ff';x.shadowBlur=14;x.fillRect(ln*100+30,450,40,50);x.shadowBlur=0;
x.fillStyle='#fff';x.font='bold 24px system-ui';x.textAlign='left';x.fillText(sc,12,32);x.textAlign='right';x.font='14px system-ui';x.fillText('Best '+best,288,30);
if(st!='play'){x.textAlign='center';x.fillStyle='#000a';x.fillRect(0,200,300,110);x.fillStyle='#fff';x.font='bold 26px system-ui';x.fillText(st=='over'?'Crash! '+sc:'Lane Dodge',150,245);x.font='15px system-ui';x.fillText('Tap or press a key to '+(st=='over'?'retry':'start'),150,277)}requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
