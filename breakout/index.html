<!doctype html><html lang="en"><head><script src="../settings.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brick Breaker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
<style>:root{--a:#ff9f43}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f1d;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(94vw,480px);border-radius:12px;background:#05070f;touch-action:none;cursor:none;border:1px solid #ff9f4355}</style>
<main><h1>BRICK BREAKER</h1><canvas id="c" width="480" height="560"></canvas><p>Mouse / touch moves the paddle · click or Space to launch</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d');let px=240,b,br,lives,sc,lv,st='ready',best=0,pw=80;
function lvl(){br=[];for(let r=0;r<5+Math.min(lv,3);r++)for(let i=0;i<8;i++)br.push({x:10+i*58,y:50+r*26,a:1,h:r*40+(lv*60)})}
function ball(){b={x:px,y:510,vx:0,vy:0}}
function init(){lives=3;sc=0;lv=0;pw=80;lvl();ball();st='ready'}
function launch(){if(st=='ready'){const s=5+lv*.5;b.vx=s*.5*(Math.random()<.5?-1:1);b.vy=-s;st='play'}else if(st=='over'){init()}}
c.onpointermove=e=>{const r=c.getBoundingClientRect();px=Math.max(pw/2,Math.min(480-pw/2,(e.clientX-r.left)/r.width*480))};c.onpointerdown=e=>{c.onpointermove(e);launch()};onkeydown=e=>{if(e.code=='Space'){e.preventDefault();launch()}};
function step(){if(st=='ready'){b.x=px;b.y=510;return}if(st!='play')return;b.x+=b.vx;b.y+=b.vy;
if(b.x<6||b.x>474){b.vx*=-1;b.x=Math.max(6,Math.min(474,b.x))}if(b.y<6){b.vy*=-1;b.y=6}
if(b.vy>0&&b.y>518&&b.y<532&&Math.abs(b.x-px)<pw/2+6){const h=(b.x-px)/(pw/2),s=Math.min(Math.hypot(b.vx,b.vy)*1.01,11);b.vx=h*s*.8;b.vy=-Math.sqrt(Math.max(s*s-b.vx*b.vx,4))}
for(const k of br)if(k.a&&b.x>k.x-6&&b.x<k.x+56&&b.y>k.y-6&&b.y<k.y+24){k.a=0;sc+=10;const dx=Math.min(b.x-k.x+6,k.x+56-b.x),dy=Math.min(b.y-k.y+6,k.y+24-b.y);dx<dy?b.vx*=-1:b.vy*=-1;break}
if(!br.some(k=>k.a)){lv++;lvl();ball();st='ready'}
if(b.y>570){lives--;if(lives<=0){st='over';best=Math.max(best,sc)}else{ball();st='ready'}}}
(function f(){step();x.fillStyle='#05070f';x.fillRect(0,0,480,560);br.forEach(k=>{if(k.a){x.fillStyle=`hsl(${k.h%360},85%,60%)`;x.shadowColor=x.fillStyle;x.shadowBlur=8;x.fillRect(k.x,k.y,56,22)}});x.shadowBlur=0;
x.fillStyle='#fff';x.shadowColor='#ff9f43';x.shadowBlur=16;x.fillRect(px-pw/2,520,pw,10);x.beginPath();x.arc(b.x,b.y,6,0,7);x.fill();x.shadowBlur=0;
x.font='bold 16px system-ui';x.textAlign='left';x.fillText('Score '+sc+'  Best '+best,10,24);x.textAlign='right';x.fillText('♥'.repeat(lives)+'  Lv '+(lv+1),470,24);
if(st!='play'){x.textAlign='center';x.font='bold 26px system-ui';x.fillText(st=='over'?'Game over — click to retry':'Click to launch',240,330)}requestAnimationFrame(f)})();init();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
