<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rain Window</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌧️</text></svg>">
<style>:root{--a:#9fd0ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0f1a;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>body{display:block}canvas{position:fixed;inset:0}#ui{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:2}</style>
<canvas id="c"></canvas><div id="ui"><button id="sn">🔇 Rain sound: off</button></div>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),R=(a,b)=>a+Math.random()*(b-a);let W,H,bg,D=[],ac,on=0,gn;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;bg=document.createElement('canvas');bg.width=W;bg.height=H;const q=bg.getContext('2d'),g=q.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1226');g.addColorStop(1,'#1a2036');q.fillStyle=g;q.fillRect(0,0,W,H);for(let i=0;i<70;i++){const h=[30,200,320,50][i%4],r=R(14,60);const rg=q.createRadialGradient(0,0,0,0,0,r);q.save();q.translate(R(0,W),R(H*.35,H));rg.addColorStop(0,`hsla(${h},90%,65%,.55)`);rg.addColorStop(1,'transparent');q.fillStyle=rg;q.beginPath();q.arc(0,0,r,0,7);q.fill();q.restore()}}rs();onresize=rs;
function sound(){if(!ac){ac=new AudioContext();const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;gn=ac.createGain();s.connect(f);f.connect(gn);gn.connect(ac.destination);s.start()}on^=1;gn.gain.value=on?.12:0;document.getElementById('sn').textContent=on?'🔊 Rain sound: on':'🔇 Rain sound: off'}
document.getElementById('sn').onclick=sound;
(function f(){x.drawImage(bg,0,0);if(Math.random()<.5)D.push({x:R(0,W),y:R(0,H*.8),r:R(2,7),v:0,t:[]});D.forEach(d=>{if(d.r>4.8&&Math.random()<.04)d.v=R(.5,3);d.y+=d.v;d.v*=.97;d.t.push([d.x+R(-.3,.3),d.y]);if(d.t.length>40)d.t.shift()});D=D.filter(d=>d.y<H+20);
D.forEach(d=>{x.strokeStyle='rgba(180,210,255,.12)';x.lineWidth=d.r*.5;x.beginPath();d.t.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();const g=x.createRadialGradient(d.x-d.r*.3,d.y-d.r*.3,0,d.x,d.y,d.r);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(150,190,255,.12)');x.fillStyle=g;x.beginPath();x.ellipse(d.x,d.y,d.r*.8,d.r,0,0,7);x.fill()});requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
