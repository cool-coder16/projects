<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odd One Out</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔎</text></svg>">
<style>:root{--a:#ff7ab6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12161f;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#g{display:grid;gap:6px;width:min(90vw,380px);margin:12px auto}.t{aspect-ratio:1;border:0;border-radius:10px;background:#1d2434;font-size:min(9vw,34px);margin:0;padding:0}</style>
<main><h1>ODD ONE OUT</h1><p>Score <b id="s">0</b> · Time <b id="t">30</b> · Best <b id="b">0</b></p><div id="g"></div><p id="m">Find the emoji that's different. The grid grows and the differences get subtler!</p><button id="go">Start</button></main>
<script>const $=id=>document.getElementById(id),SETS=[['🍎','🍏'],['😀','😃'],['🔵','🟦'],['🕐','🕑'],['🌕','🌖'],['👍','👎'],['🐶','🐱'],['⭐','🌟'],['🔔','🛎️'],['🍊','🍋']];let s=0,run=0,t0,best=0,odd;
function round(){const n=Math.min(7,3+Math.floor(s/4)),pr=SETS[Math.floor(Math.random()*SETS.length)],f=Math.random()<.5;$('g').style.gridTemplateColumns=`repeat(${n},1fr)`;$('g').innerHTML='';odd=Math.floor(Math.random()*n*n);
for(let i=0;i<n*n;i++){const b=document.createElement('button');b.className='t';b.textContent=pr[(i==odd)^f?1:0];b.onclick=()=>pick(i);$('g').append(b)}}
function pick(i){if(!run)return;if(i==odd){s++;$('s').textContent=s}else s=Math.max(0,s-1);$('s').textContent=s;round()}
$('go').onclick=()=>{s=0;run=1;t0=Date.now();$('s').textContent=0;$('go').style.display='none';round()};
setInterval(()=>{if(!run)return;const l=Math.max(0,30-(Date.now()-t0)/1000);$('t').textContent=Math.ceil(l);if(l<=0){run=0;$('g').innerHTML='';best=Math.max(best,s);$('b').textContent=best;$('m').textContent='Time! You found '+s+'.';$('go').style.display='';$('go').textContent='Play again';window.Hub&&Hub.score('oddone',s)}},100);</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
