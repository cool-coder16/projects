<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dart Spinner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<style>:root{--a:#ffb454}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1b1020;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(92vw,400px);border-radius:14px;touch-action:none;cursor:pointer;border:1px solid #ffffff22}</style>
<main><h1>DART SPINNER</h1><canvas id="c" width="400" height="560"></canvas><p>Tap to throw a dart into the spinning target. Don't hit another dart!</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),TAU=Math.PI*2;let rot=0,S=[],fly=null,sc=0,lv=1,need,left,st='ready',best=0,t=0,msg='';
function level(){S=[];const pre=Math.min(lv-1,6);for(let i=0;i<pre;i++)S.push(i*TAU/pre+Math.random()*.4);need=5+Math.floor(lv/2);left=need;fly=null}
function init(){sc=0;lv=1;level();st='play'}
c.onpointerdown=()=>{if(st!='play'){init();return}if(!fly&&left>0)fly={y:500}};
const dist=(a,b)=>{const d=Math.abs(a-b)%TAU;return Math.min(d,TAU-d)};
function over(){st='over';best=Math.max(best,sc);window.Hub&&Hub.score('darts',sc)}
(function f(){t++;if(st=='play'){const sp=(.02+lv*.004)*(1+.7*Math.sin(t/60*(1+lv*.05)));rot+=sp*(lv%2?1:-1);
if(fly){fly.y-=22;if(fly.y<=290){const a=((Math.PI/2-rot)%TAU+TAU)%TAU;if(S.some(s=>dist(s,a)<.2)){fly=null;over()}else{S.push(a);fly=null;sc++;left--;if(left<=0){lv++;msg='Level '+lv;setTimeout(()=>{msg=''},900);level()}}}}}
x.fillStyle='#1b1020';x.fillRect(0,0,400,560);x.save();x.translate(200,200);x.rotate(rot);
S.forEach(a=>{x.save();x.rotate(a);x.fillStyle='#ddd';x.fillRect(-2,70,4,60);x.fillStyle='#ff5d73';x.beginPath();x.moveTo(0,70);x.lineTo(-9,100);x.lineTo(9,100);x.fill();x.restore()});
const g=x.createRadialGradient(0,0,10,0,0,70);g.addColorStop(0,'#ffcf7a');g.addColorStop(1,'#b86a2a');x.fillStyle=g;x.shadowColor='#ffb454';x.shadowBlur=18;x.beginPath();x.arc(0,0,70,0,7);x.fill();x.shadowBlur=0;x.strokeStyle='#8a4a1a';x.lineWidth=3;for(const r of[20,40,58]){x.beginPath();x.arc(0,0,r,0,7);x.stroke()}x.restore();
S.forEach(a=>{x.save();x.translate(200,200);x.rotate(rot+a);x.fillStyle='#fff';x.beginPath();x.arc(0,70,5,0,7);x.fill();x.restore()});
if(fly){x.fillStyle='#ddd';x.fillRect(198,fly.y,4,60);x.fillStyle='#ff5d73';x.beginPath();x.moveTo(200,fly.y);x.lineTo(191,fly.y+30);x.lineTo(209,fly.y+30);x.fill()}
for(let i=0;i<left-(fly?1:0);i++){x.fillStyle='#ddd';x.fillRect(188+ (i%12)*0,0,0,0)}
x.fillStyle='#ddd';for(let i=0;i<Math.max(0,left-(fly?1:0));i++){x.save();x.translate(30+i*18,520);x.fillRect(-2,-20,4,28);x.fillStyle='#ff5d73';x.beginPath();x.moveTo(0,-26);x.lineTo(-6,-14);x.lineTo(6,-14);x.fill();x.fillStyle='#ddd';x.restore()}
x.fillStyle='#fff';x.font='bold 30px system-ui';x.textAlign='left';x.fillText(sc,16,44);x.font='15px system-ui';x.textAlign='right';x.fillText('Level '+lv+' · Best '+best,384,40);
if(msg){x.textAlign='center';x.font='bold 36px system-ui';x.fillStyle='#ffb454';x.fillText(msg,200,330)}
if(st!='play'){x.textAlign='center';x.fillStyle='#000a';x.fillRect(0,230,400,130);x.fillStyle='#fff';x.font='bold 28px system-ui';x.fillText(st=='over'?'Clash! '+sc+' darts':'Dart Spinner',200,282);x.font='16px system-ui';x.fillText('Tap to '+(st=='over'?'retry':'start'),200,318)}requestAnimationFrame(f)})();level();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
