<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reflex — Reaction Test</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>:root{--a:#ffd23f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e1116;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#pad{height:300px;border-radius:20px;display:grid;place-items:center;font-size:28px;font-weight:700;cursor:pointer;background:#2b3240;transition:background .1s}#pad.w{background:#c0392b}#pad.g{background:#2ecc71;color:#000}</style>
<main><h1>REFLEX</h1><div id="pad">Click to start</div><p id="info">Click when it turns green. How fast are you?</p></main>
<script>const $=id=>document.getElementById(id),p=$('pad');let s=0,t0,tm,h=[];
p.onpointerdown=()=>{if(s==0){s=1;p.className='w';p.textContent='Wait for green…';tm=setTimeout(()=>{s=2;p.className='g';p.textContent='CLICK!';t0=performance.now()},1000+Math.random()*3000)}
else if(s==1){clearTimeout(tm);s=0;p.className='';p.textContent='Too soon! Click to retry'}
else{const ms=Math.round(performance.now()-t0);h=[...h,ms].slice(-5);window.Hub&&Hub.score('reflex',ms,true);s=0;p.className='';p.textContent=ms+' ms — click to go again';
$('info').innerHTML=`${ms<200?'Lightning ⚡':ms<300?'Quick! 🚀':'Keep practicing 🙂'}<br>Best: ${Math.min(...h)} ms · Avg of last ${h.length}: ${Math.round(h.reduce((a,b)=>a+b)/h.length)} ms`}}</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
