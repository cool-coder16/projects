<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gradient Lab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
<style>:root{--a:#a78bfa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12121a;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#pv{height:260px;border-radius:20px;margin-bottom:16px;box-shadow:0 10px 50px #0008}.r{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px 0}input[type=color]{width:56px;height:44px;border:0;border-radius:10px;background:none;padding:0}input[type=range]{accent-color:var(--a)}select{background:#222;color:#fff;border:0;padding:8px;border-radius:10px}code{display:block;background:#0008;padding:12px;border-radius:10px;font-size:13px;user-select:text;word-break:break-all}</style>
<main><h1>GRADIENT LAB</h1><div id="pv"></div><div class="r"><input type="color" id="c1" value="#ff6b6b"><input type="color" id="c2" value="#845ef7"><input type="color" id="c3" value="#22d3ee"><select id="ty"><option>linear</option><option>radial</option><option>conic</option></select></div>
<div class="r">Angle <input id="an" type="range" min="0" max="360" value="135"> <label><input type="checkbox" id="t3" checked> 3 colors</label></div><code id="css"></code><button id="cp">Copy CSS</button><button id="rn">🎲 Random</button></main>
<script>const $=id=>document.getElementById(id);function u(){const cs=[$('c1').value,$('c2').value,...($('t3').checked?[$('c3').value]:[])].join(', '),t=$('ty').value,a=$('an').value;
const v=t=='linear'?`linear-gradient(${a}deg, ${cs})`:t=='radial'?`radial-gradient(circle, ${cs})`:`conic-gradient(from ${a}deg, ${cs}, ${$('c1').value})`;$('pv').style.background=v;$('css').textContent='background: '+v+';'}
['c1','c2','c3','ty','an','t3'].forEach(i=>$(i).oninput=u);$('rn').onclick=()=>{['c1','c2','c3'].forEach(i=>$(i).value='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'));$('an').value=Math.floor(Math.random()*360);u()};
$('cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText($('css').textContent);$('cp').textContent='Copied ✓';setTimeout(()=>$('cp').textContent='Copy CSS',1200)};u();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
