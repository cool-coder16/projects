<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ball Pit</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎱</text></svg>">
<style>:root{--a:#ff7ab6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10131c;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(96vw,640px);border-radius:14px;background:#0a0c13;touch-action:none;cursor:crosshair;border:1px solid #ffffff22}</style>
<main><h1>BALL PIT</h1><canvas id="c" width="640" height="420"></canvas><p>Click to drop balls · Move the mouse to tilt gravity · <b id="n">0</b> balls</p><button id="sh">💥 Shake</button><button id="cl">Clear</button></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),W=640,H=420;let B=[],gx=0,gy=.35;
const add=(px,py)=>{if(B.length>160)B.shift();const r=10+Math.random()*16;B.push({x:px,y:py,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,r,m:r*r,h:Math.random()*360})};
const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]};
c.onpointermove=e=>{const[a,b]=pt(e);const dx=a-W/2,dy=b-H/2,d=Math.hypot(dx,dy)||1;gx=dx/d*.35*Math.min(1,d/150);gy=dy/d*.35*Math.min(1,d/150);if(Math.abs(gx)+Math.abs(gy)<.05)gy=.05};
c.onpointerdown=e=>{const[a,b]=pt(e);for(let i=0;i<4;i++)add(a+Math.random()*20-10,b+Math.random()*20-10)};
document.getElementById('sh').onclick=()=>B.forEach(b=>{b.vx+=(Math.random()-.5)*30;b.vy-=Math.random()*20});document.getElementById('cl').onclick=()=>B=[];
(function f(){for(let s=0;s<2;s++){for(const b of B){b.vx+=gx/2;b.vy+=gy/2;b.vx*=.999;b.vy*=.999;b.x+=b.vx/2;b.y+=b.vy/2;
if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.8}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.8}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*.8}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.8}}
for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){const a=B[i],b=B[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;if(d<m&&d>0){const nx=dx/d,ny=dy/d,o=(m-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const j2=-(1.8)*rv/(1/a.m+1/b.m);a.vx-=j2*nx/a.m;a.vy-=j2*ny/a.m;b.vx+=j2*nx/b.m;b.vy+=j2*ny/b.m}}}}
x.fillStyle='#0a0c13';x.fillRect(0,0,W,H);for(const b of B){const g=x.createRadialGradient(b.x-b.r*.35,b.y-b.r*.35,b.r*.1,b.x,b.y,b.r);g.addColorStop(0,`hsl(${b.h},90%,80%)`);g.addColorStop(1,`hsl(${b.h},80%,45%)`);x.fillStyle=g;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()}
document.getElementById('n').textContent=B.length;requestAnimationFrame(f)})();for(let i=0;i<30;i++)add(100+Math.random()*440,60+Math.random()*150);</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
