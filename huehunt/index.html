<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hue Hunt — Color Match</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
<style>:root{--a:#ff6fd8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#16121f;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>.sw{display:inline-block;width:42%;height:140px;border-radius:16px;margin:4px;border:2px solid #fff3}input{width:80%;margin:6px}#r{accent-color:#f55}#g{accent-color:#5f5}#b{accent-color:#58f}</style>
<main><h1>HUE HUNT</h1><div><div class="sw" id="t"></div><div class="sw" id="m"></div></div><p>Target ← → Your mix</p>
<input id="r" type="range" max="255"><br><input id="g" type="range" max="255"><br><input id="b" type="range" max="255"><br>
<button id="go">Lock it in</button><p>Round <b id="rd">1</b>/5 · Score <b id="tot">0</b></p><p id="res">Mix the sliders to match the target color.</p></main>
<script>const $=id=>document.getElementById(id),S=['r','g','b'].map($);let tgt,round=0,tot=0;
const mix=()=>S.map(s=>+s.value),upd=()=>$('m').style.background=`rgb(${mix()})`;
function nw(){tgt=[0,0,0].map(()=>Math.floor(Math.random()*256));$('t').style.background=`rgb(${tgt})`;S.forEach(s=>s.value=128);upd();$('rd').textContent=round+1}
S.forEach(s=>s.oninput=upd);
$('go').onclick=()=>{if(round>=5){round=0;tot=0;$('tot').textContent=0;$('go').textContent='Lock it in';nw();return}
const m=mix(),d=Math.hypot(...m.map((v,i)=>v-tgt[i])),sc=Math.max(0,Math.round(100-d/3));tot+=sc;round++;$('tot').textContent=tot;
$('res').innerHTML=`Target was rgb(${tgt}) — you got <b>${sc}</b>/100`;
if(round==5){$('res').innerHTML+=`<br><b>Final: ${tot}/500 ${tot>420?'🏆 Eagle eyes!':tot>300?'👍 Nice':'🎨 Keep training'}</b>`;$('go').textContent='Play again'}else nw()};nw();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
