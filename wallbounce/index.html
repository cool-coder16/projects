<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wall Bounce</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
<style>:root{--a:#7cf}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1b2a;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(92vw,400px);border-radius:14px;background:#08111c;touch-action:none;cursor:none;border:1px solid #ffffff22}</style>
<main><h1>WALL BOUNCE</h1><canvas id="c" width="400" height="500"></canvas><p>Move the paddle to keep the ball bouncing. Each bounce scores; the ball speeds up!</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d');let px=200,b,sc=0,st='ready',best=0;
function ball(){b={x:200,y:120,vx:3,vy:3.2}}
c.onpointermove=e=>{const r=c.getBoundingClientRect();px=Math.max(40,Math.min(360,(e.clientX-r.left)/r.width*400))};c.onpointerdown=e=>{c.onpointermove(e);if(st!='play'){ball();sc=0;st='play'}};
ball();(function f(){if(st=='play'){b.x+=b.vx;b.y+=b.vy;if(b.x<8||b.x>392){b.vx*=-1;b.x=Math.max(8,Math.min(392,b.x))}if(b.y<8){b.vy=Math.abs(b.vy);b.y=8}
if(b.vy>0&&b.y>462&&b.y<480&&Math.abs(b.x-px)<48){const h=(b.x-px)/48;const s=Math.min(Math.hypot(b.vx,b.vy)*1.04,12);b.vx=h*s*.8;b.vy=-Math.sqrt(Math.max(s*s-b.vx*b.vx,9));sc++}
if(b.y>520){st='over';best=Math.max(best,sc);window.Hub&&Hub.score('wallbounce',sc)}}
x.fillStyle='#08111c';x.fillRect(0,0,400,500);x.fillStyle='#7cf';x.shadowColor='#7cf';x.shadowBlur=14;x.fillRect(px-48,470,96,10);x.fillStyle='#fff';x.beginPath();x.arc(b.x,b.y,8,0,7);x.fill();x.shadowBlur=0;
x.font='bold 30px system-ui';x.textAlign='left';x.fillText(sc,14,40);x.font='14px system-ui';x.textAlign='right';x.fillText('Best '+best,386,36);
if(st!='play'){x.textAlign='center';x.fillStyle='#000a';x.fillRect(0,190,400,110);x.fillStyle='#fff';x.font='bold 26px system-ui';x.fillText(st=='over'?'Missed! '+sc+' bounces':'Wall Bounce',200,235);x.font='15px system-ui';x.fillText('Tap to '+(st=='over'?'retry':'start'),200,268)}requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
