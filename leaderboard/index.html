<!doctype html><html lang="en" data-scroll><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaderboards</title><meta name="theme-color" content="#0a0d16">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<style>body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% -10%,#22305a 0,#0a0d16 55%) fixed;color:#e6edf3;font-family:system-ui,-apple-system,sans-serif;padding:70px 16px 50px}main{max-width:820px;margin:auto}h1{font-weight:200;letter-spacing:.35em;text-align:center;margin:0 0 6px;font-size:clamp(22px,4.5vw,36px)}.sub{text-align:center;opacity:.6;margin:0 0 22px}
#pbar{position:fixed;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;z-index:50}#pbar a{color:#fff;text-decoration:none;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;font:600 14px system-ui;backdrop-filter:blur(6px)}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:18px}.tabs button{background:#ffffff12;color:#fff;border:1px solid #ffffff22;border-radius:18px;padding:8px 18px;cursor:pointer;font-size:15px}.tabs button.s{background:#7ee0ff;color:#04101a;font-weight:700;border-color:transparent}
#chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}#chips button{background:#ffffff12;color:#fff;border:1px solid #ffffff1c;border-radius:16px;padding:6px 12px;cursor:pointer;font-size:13px}#chips button:hover{background:#ffffff22}#chips button.s{background:#7ee0ff;color:#04101a;font-weight:700}#chips button.has{border-color:#ffd23f88}
.card{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:16px;padding:18px}.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}.hd h2{margin:0;font-size:22px}.hd a,.hd button{background:#7ee0ff;color:#000;text-decoration:none;border:0;border-radius:16px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;margin-left:6px}.hd button{background:#ffffff22;color:#fff}
.you{font-size:14px;opacity:.8;margin:0 0 10px}table{width:100%;border-collapse:collapse}td{padding:10px 6px;border-bottom:1px solid #ffffff12}td:first-child{width:46px;text-align:center;font-size:18px}td:nth-child(3){text-align:right;font-weight:800;color:#7ee0ff}td:nth-child(4){text-align:right;opacity:.5;font-size:12px;width:80px}tr.me td{background:#7ee0ff1a}tr:nth-child(1) td:nth-child(2){font-weight:700;color:#ffd23f}
.e{text-align:center;opacity:.65;padding:28px 0}.hof{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.hof a{display:block;background:#ffffff0d;border:1px solid #ffffff1a;border-radius:14px;padding:12px 14px;color:inherit;text-decoration:none;transition:.15s}.hof a:hover{border-color:#ffd23f;transform:translateY(-2px)}.hof b{display:block}.hof small{opacity:.6}.hof .k{color:#ffd23f}
.cr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 20px}.cr span{background:#ffd23f22;border:1px solid #ffd23f55;border-radius:16px;padding:6px 14px;font-size:14px}</style></head><body>
<div id="pbar"><a href="../">Projects</a><a href="../">🏠</a></div>
<main><h1>LEADERBOARDS</h1><p class="sub">Top players for every game · <a href="../account/" style="color:#7ee0ff">log in</a> so your scores are posted</p>
<div class="tabs"><button id="t1" class="s">By game</button><button id="t2">👑 Hall of Fame</button></div>
<div id="v1"><div id="chips"></div><div class="card"><div class="hd"><h2 id="gt"></h2><div><a id="pl" href="#">▶ Play</a><button id="rf">↻</button></div></div><p class="you" id="yb"></p><div id="lb"></div></div></div>
<div id="v2" hidden><p class="sub">Who holds #1 in each game right now</p><div class="cr" id="cr"></div><div class="hof" id="hof"></div></div></main>
<script>
const $=id=>document.getElementById(id),G=Hub.LIST,me=(Hub.rd('hubUser')||{}).username,mine=Hub.rd('hubScores')||{};let db,cur;
const ago=ms=>{if(!ms)return'';const d=(Date.now()-ms)/1000;return d<60?'just now':d<3600?Math.floor(d/60)+'m ago':d<86400?Math.floor(d/3600)+'h ago':Math.floor(d/86400)+'d ago'};
G.forEach(g=>{const b=document.createElement('button');b.textContent=g.name;b.dataset.id=g.id;if(mine[g.id])b.className='has';b.onclick=()=>show(g.id);$('chips').append(b)});
const col=id=>db.collection('leaderboard').doc(id).collection('entries');
async function show(id){cur=id;const g=Hub.GAMES[id];location.hash=id;[...$('chips').children].forEach(b=>b.classList.toggle('s',b.dataset.id==id));$('gt').textContent=g.name+' — '+(g.low?'lowest':'highest')+' '+g.unit;$('pl').href='../'+g.dir+'/';$('yb').textContent=mine[id]?'Your best: '+mine[id].v+' '+g.unit:(me?'You have not played this one yet.':'');$('lb').innerHTML='<div class="e">Loading…</div>';
 try{if(!db)db=(await Hub.load()).db;const q=await col(id).orderBy('score',g.low?'asc':'desc').limit(25).get();if(cur!=id)return;
  if(q.empty){$('lb').innerHTML='<div class="e">No scores yet — be the first! 🥇</div>';return}
  const t=document.createElement('table');let i=0;q.forEach(d=>{const x=d.data(),r=t.insertRow();i++;if(x.username==me)r.className='me';r.insertCell().textContent=['🥇','🥈','🥉'][i-1]||i;r.insertCell().textContent=x.username;r.insertCell().textContent=x.score+' '+g.unit;r.insertCell().textContent=ago(x.updated)});$('lb').innerHTML='';$('lb').append(t)}
 catch(e){$('lb').innerHTML='<div class="e">Could not load scores right now.</div>'}}
let hofDone=0;async function hof(){if(hofDone)return;$('hof').innerHTML='<div class="e" style="grid-column:1/-1">Loading the champions…</div>';try{if(!db)db=(await Hub.load()).db;
 const res=await Promise.all(G.map(g=>col(g.id).orderBy('score',g.low?'asc':'desc').limit(1).get().then(q=>q.empty?null:q.docs[0].data()).catch(()=>null)));hofDone=1;const crowns={};$('hof').innerHTML='';
 G.forEach((g,i)=>{const r=res[i],a=document.createElement('a');a.href='#'+g.id;a.onclick=e=>{e.preventDefault();tab(1);show(g.id)};if(r){crowns[r.username]=(crowns[r.username]||0)+1;a.innerHTML=`<small>${g.name}</small><b><span class="k">👑</span> ${r.username.replace(/</g,'&lt;')}</b><small>${r.score} ${g.unit}</small>`}else a.innerHTML=`<small>${g.name}</small><b style="opacity:.5">Up for grabs</b><small>No scores yet</small>`;$('hof').append(a)});
 const top=Object.entries(crowns).sort((a,b)=>b[1]-a[1]).slice(0,5);$('cr').innerHTML=top.length?top.map(([u,n])=>`<span>👑 ${u.replace(/</g,'&lt;')} · ${n} ${n==1?'crown':'crowns'}</span>`).join(''):'<span>No champions yet — claim a crown!</span>'}catch(e){$('hof').innerHTML='<div class="e" style="grid-column:1/-1">Could not load right now.</div>'}}
function tab(n){$('v1').hidden=n!=1;$('v2').hidden=n!=2;$('t1').className=n==1?'s':'';$('t2').className=n==2?'s':'';if(n==2)hof()}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);$('rf').onclick=()=>show(cur);
show(Hub.GAMES[location.hash.slice(1)]?location.hash.slice(1):G[0].id);
</script></body></html>
