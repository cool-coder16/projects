<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spin Wheel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎡</text></svg>">
<style>:root{--a:#ffb84d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#160f26;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#w{position:relative;width:min(90vw,380px);margin:0 auto 12px}canvas{width:100%;display:block}#pt{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:34px;filter:drop-shadow(0 2px 4px #000)}textarea{width:min(90vw,380px);height:110px;background:#241a3d;color:#fff;border:1px solid #ffffff22;border-radius:12px;padding:10px;font-size:15px}#res{font-size:26px;font-weight:800;min-height:36px;color:var(--a)}</style>
<main><h1>SPIN WHEEL</h1><div id="w"><canvas id="c" width="400" height="400"></canvas><div id="pt">▼</div></div><div id="res"></div><button id="sp">🎡 SPIN</button><button id="rm" style="display:none">Remove winner</button><p>One option per line:</p><textarea id="ta">Pizza
Tacos
Sushi
Burgers
Pasta
Salad</textarea></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id),C=['#ff5d73','#ffb84d','#4cd97b','#4dc3ff','#b388ff','#ff7ab6','#2ed1b8','#ffd23f'];let ang=0,spinning=0,win=-1,ac;
const opts=()=>$('ta').value.split('\n').map(s=>s.trim()).filter(Boolean);
function draw(){const o=opts(),n=o.length||1;x.clearRect(0,0,400,400);x.save();x.translate(200,200);x.rotate(ang);o.forEach((t,i)=>{const a0=i*2*Math.PI/n,a1=(i+1)*2*Math.PI/n;x.fillStyle=C[i%C.length];x.beginPath();x.moveTo(0,0);x.arc(0,0,190,a0,a1);x.fill();x.strokeStyle='#160f26';x.lineWidth=3;x.stroke();
x.save();x.rotate((a0+a1)/2);x.fillStyle='#160f26';x.font='bold 18px system-ui';x.textAlign='right';x.fillText(t.length>14?t.slice(0,13)+'…':t,176,6);x.restore()});x.restore();x.fillStyle='#160f26';x.beginPath();x.arc(200,200,22,0,7);x.fill();x.strokeStyle='#ffb84d';x.lineWidth=4;x.stroke()}
function tick(){ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=900;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.05);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.05)}
$('sp').onclick=()=>{const o=opts();if(spinning||o.length<2)return;spinning=1;$('res').textContent='';$('rm').style.display='none';const n=o.length,a0=ang,tot=(5+Math.random()*3)*2*Math.PI,t0=performance.now();let last=-1;
(function f(t){const k=Math.min(1,(t-t0)/4500),e=1-(1-k)**4;ang=a0+tot*e;const seg=Math.floor((((-Math.PI/2-ang)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)/(2*Math.PI/n));if(seg!=last){last=seg;tick()}draw();
if(k<1)requestAnimationFrame(f);else{spinning=0;win=seg;$('res').textContent='🎉 '+o[seg];$('rm').style.display=''}})(t0)};
$('rm').onclick=()=>{const o=opts();o.splice(win,1);$('ta').value=o.join('\n');$('res').textContent='';$('rm').style.display='none';draw()};$('ta').oninput=draw;draw();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
