<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unbeatable — Tic-Tac-Toe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❌</text></svg>">
<style>:root{--a:#4fe3c1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101820;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#bd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(80vw,330px);margin:0 auto 14px}.c{aspect-ratio:1;border:0;border-radius:14px;background:#1d2b38;font-size:min(16vw,70px);font-weight:800;margin:0;padding:0;color:#fff}.c.X{color:#4fe3c1}.c.O{color:#ff5d73}.c.w{background:#27465a}</style>
<main><h1>UNBEATABLE</h1><div id="bd"></div><p id="msg">You are X. Try to beat the perfect AI!</p><p>You won: <b id="w">0</b> (spoiler: 0) · Draws: <b id="d">0</b> · AI wins: <b id="a">0</b></p><button id="nw">New game</button></main>
<script>const $=id=>document.getElementById(id),L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let b,over,st={w:0,d:0,a:0};
const win=b=>{for(const[x,y,z]of L)if(b[x]&&b[x]==b[y]&&b[x]==b[z])return[b[x],[x,y,z]];return b.every(Boolean)?['T',[]]:null};
function mm(b,p){const r=win(b);if(r)return r[0]=='O'?1:r[0]=='X'?-1:0;let best=p=='O'?-2:2;for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const v=mm(b,p=='O'?'X':'O');b[i]='';best=p=='O'?Math.max(best,v):Math.min(best,v)}return best}
function show(){[...$('bd').children].forEach((e,i)=>{e.textContent=b[i];e.className='c '+b[i]});const r=win(b);if(r){over=1;r[1].forEach(i=>$('bd').children[i].classList.add('w'));
const k=r[0]=='T'?'d':r[0]=='O'?'a':'w';st[k]++;$(k).textContent=st[k];$('msg').textContent=r[0]=='T'?'A draw — the best you can do!':r[0]=='O'?'The AI wins. 🤖':'You won?!'}}
function mv(i){if(over||b[i])return;b[i]='X';show();if(over)return;let bi,bv=-2;for(let j=0;j<9;j++)if(!b[j]){b[j]='O';const v=mm(b,'X');b[j]='';if(v>bv){bv=v;bi=j}}b[bi]='O';show()}
function init(){b=Array(9).fill('');over=0;$('bd').innerHTML='';for(let i=0;i<9;i++){const e=document.createElement('button');e.onclick=()=>mv(i);$('bd').append(e)}$('msg').textContent='You are X. Try to beat the perfect AI!';show()}
$('nw').onclick=init;init();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
