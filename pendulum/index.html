<!doctype html><html lang="en"><head><script src="../settings.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pendulum Wave</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎐</text></svg>">
<style>:root{--a:#7aa2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b16;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(96vw,640px);border-radius:14px;background:#04060d}input{accent-color:#7aa2ff}</style>
<main><h1>PENDULUM WAVE</h1><canvas id="c" width="640" height="420"></canvas><p>Each pendulum swings at a slightly different speed — watch order emerge from chaos.<br>Speed <input id="sp" type="range" min="1" max="30" value="8"> <button id="rs">Restart</button></p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),N=18;let t=0;
document.getElementById('rs').onclick=()=>t=0;
(function f(){t+=.016*document.getElementById('sp').value/8;x.fillStyle='rgba(4,6,13,.35)';x.fillRect(0,0,640,420);x.fillStyle='#fff3';x.fillRect(40,20,560,4);
for(let i=0;i<N;i++){const f=(30+i)/60,a=.6*Math.cos(2*Math.PI*f*t),L=380*(30/(30+i))**2*.97+10,px=60+i*(520/(N-1)),bx=px+Math.sin(a)*L*.55,by=24+Math.cos(a)*L;
x.strokeStyle='#ffffff22';x.lineWidth=1;x.beginPath();x.moveTo(px,24);x.lineTo(bx,by);x.stroke();const h=i*340/N;x.fillStyle=`hsl(${h},90%,62%)`;x.shadowColor=x.fillStyle;x.shadowBlur=18;x.beginPath();x.arc(bx,by,11,0,7);x.fill();x.shadowBlur=0}requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
