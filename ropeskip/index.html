<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rope Skip</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪢</text></svg>">
<style>:root{--a:#ff9f43}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14212e;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(94vw,480px);border-radius:14px;background:linear-gradient(#27465f,#162a3b);touch-action:none;cursor:pointer;border:1px solid #ffffff22}</style>
<main><h1>ROPE SKIP</h1><canvas id="c" width="480" height="360"></canvas><p>Tap, click or press Space to jump — be in the air when the rope sweeps under your feet!</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),GY=280;let th=-1.2,sp=.05,y=GY,vy=0,sc=0,st='ready',best=0,fl=0;
function jump(){if(st!='play'){th=-1.2;sp=.05;y=GY;vy=0;sc=0;st='play';return}if(y>=GY){vy=-11.5}}
c.onpointerdown=jump;onkeydown=e=>{if(e.code=='Space'){e.preventDefault();jump()}};
(function f(){if(st=='play'){const o=th;th+=sp;vy+=.7;y=Math.min(GY,y+vy);if(y>=GY)vy=0;const a=((o%6.283)+6.283)%6.283,b=((th%6.283)+6.283)%6.283;
if(a<b?(a<4.712&&b>=4.712):false){if(y>GY-26){st='over';best=Math.max(best,sc);window.Hub&&Hub.score('ropeskip',sc)}else{sc++;sp=Math.min(.12,sp+.0035);fl=1}}}fl*=.9;
x.fillStyle='#162a3b';x.fillRect(0,0,480,360);x.fillStyle='#2c4258';x.fillRect(0,GY+30,480,80);
x.strokeStyle=fl>.3?'#ffe27a':'#ff9f43';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(150,GY-20);x.quadraticCurveTo(240,GY-20-150*Math.sin(th),330,GY-20);x.stroke();x.fillStyle='#8a5a2a';x.fillRect(142,GY-26,10,16);x.fillRect(328,GY-26,10,16);x.font='54px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('🧒',240,y-8);x.textBaseline='alphabetic';x.fillStyle='#fff';x.font='bold 34px system-ui';x.textAlign='left';x.fillText(sc,16,44);x.font='14px system-ui';x.fillText('Best '+best,16,66);
if(st!='play'){x.fillStyle='#000a';x.fillRect(0,110,480,120);x.fillStyle='#fff';x.textAlign='center';x.font='bold 28px system-ui';x.fillText(st=='over'?'Tripped! '+sc+' skips':'Rope Skip',240,160);x.font='16px system-ui';x.fillText('Tap to '+(st=='over'?'retry':'start'),240,196)}requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
