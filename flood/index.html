<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flood — Color Puzzle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
<style>:root{--a:#ff7ab6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14121f;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(92vw,420px);border-radius:12px}#cb{display:flex;gap:10px;justify-content:center;margin:14px}#cb i{width:48px;height:48px;border-radius:50%;cursor:pointer;border:3px solid #fff3;transition:.1s}#cb i:hover{transform:scale(1.12)}</style>
<main><h1>FLOOD</h1><canvas id="c" width="420" height="420"></canvas><div id="cb"></div><p>Moves left <b id="mv">0</b> · Fill the whole board with one color, starting from the top-left corner.</p><p id="msg"></p><button id="nw">New board</button></main>
<script>const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d'),N=14,Z=30,C=['#ff4d6d','#ffd23f','#2ecc71','#3da5ff','#a66bff','#ff9f43'];let g,left,over,wins=0;
C.forEach((col,k)=>{const i=document.createElement('i');i.style.background=col;i.onclick=()=>mv(k);$('cb').append(i)});
function init(){g=Array.from({length:N*N},()=>Math.floor(Math.random()*6));left=25;over=0;$('msg').textContent='';draw()}
function reg(){const s=new Set([0]),q=[0];while(q.length){const i=q.pop(),X=i%N,Y=Math.floor(i/N);for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const u=X+a,v=Y+b,j=v*N+u;if(u>=0&&v>=0&&u<N&&v<N&&!s.has(j)&&g[j]==g[0]){s.add(j);q.push(j)}}}return s}
function mv(k){if(over||k==g[0])return;const s=reg();s.forEach(i=>g[i]=k);left--;draw();if(g.every(v=>v==g[0])){over=1;$('msg').textContent=`🎉 Flooded with ${left} moves to spare!`}else if(!left){over=1;$('msg').textContent='Out of moves — try a new board!'}}
function draw(){g.forEach((v,i)=>{x.fillStyle=C[v];x.beginPath();x.roundRect((i%N)*Z+1,Math.floor(i/N)*Z+1,Z-2,Z-2,6);x.fill()});x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(1,1,Z-2,Z-2);$('mv').textContent=left}
$('nw').onclick=init;init();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
