<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number Memory</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>:root{--a:#9d7cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1424;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#n{font-size:min(14vw,64px);font-weight:800;letter-spacing:.1em;min-height:90px;display:grid;place-items:center;font-variant-numeric:tabular-nums}#bar{height:8px;background:#ffffff22;border-radius:4px;margin:10px auto;width:80%;overflow:hidden}#bf{height:100%;background:var(--a);width:0}input{font-size:30px;width:min(80vw,380px);text-align:center;background:#1a2036;color:#fff;border:2px solid #ffffff33;border-radius:14px;padding:10px;letter-spacing:.1em}</style>
<main><h1>NUMBER MEMORY</h1><p>Level <b id="lv">0</b> · Best <b id="bs">0</b></p><div id="n">Ready?</div><div id="bar"><div id="bf"></div></div><input id="a" inputmode="numeric" autocomplete="off" disabled placeholder="type it here"><p id="msg">Memorize the number, then type it back. It gets one digit longer each level.</p><button id="go">Start</button></main>
<script>const $=id=>document.getElementById(id);let L,num,best=0,phase='idle';
function round(){L++;$('lv').textContent=L-1;num=String(1+Math.floor(Math.random()*9))+Array.from({length:L-1},()=>Math.floor(Math.random()*10)).join('');$('n').textContent=num;$('a').value='';$('a').disabled=true;$('msg').textContent='Memorize…';phase='show';
const ms=1200+L*600,t0=Date.now();const iv=setInterval(()=>{const f=(Date.now()-t0)/ms;$('bf').style.width=Math.max(0,100-f*100)+'%';if(f>=1){clearInterval(iv);$('n').textContent='?';$('a').disabled=false;$('a').focus();$('msg').textContent='Type the number and press Enter';phase='ask'}},40)}
$('a').onkeydown=e=>{if(e.key!='Enter'||phase!='ask')return;phase='idle';if($('a').value.trim()==num){$('n').textContent='✓';$('msg').textContent='Correct!';setTimeout(round,700)}else{best=Math.max(best,L-1);$('bs').textContent=best;$('n').innerHTML=num;$('msg').textContent='Wrong — you typed '+($('a').value||'nothing')+'. You reached level '+(L-1);window.Hub&&Hub.score('nummem',L-1);$('go').style.display='';$('go').textContent='Play again'}};
$('go').onclick=()=>{L=0;$('go').style.display='none';round()};</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
