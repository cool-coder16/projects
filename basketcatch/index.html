<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Basket Catch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>">
<style>:root{--a:#ff9f43}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#2a1a10;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(92vw,400px);border-radius:14px;background:linear-gradient(#ffd9a0,#ff9f6b);touch-action:none;cursor:none;border:1px solid #ffffff44}</style>
<main><h1>BASKET CATCH</h1><canvas id="c" width="400" height="520"></canvas><p>Move to catch fruit 🍎 and dodge rocks 🪨. Three lives!</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),FR=['🍎','🍊','🍌','🍇','🍓','🍉'];let px=200,I=[],sc=0,lives=3,st='ready',best=0,t=0;
c.onpointermove=e=>{const r=c.getBoundingClientRect();px=Math.max(40,Math.min(360,(e.clientX-r.left)/r.width*400))};c.onpointerdown=e=>{c.onpointermove(e);if(st!='play'){I=[];sc=0;lives=3;t=0;st='play'}};
(function f(){if(st=='play'){t++;if(t%Math.max(18,45-Math.floor(t/120))==0)I.push({x:20+Math.random()*360,y:-30,v:2+Math.random()*1.5+t/1500,r:Math.random()<.22,e:FR[Math.floor(Math.random()*6)]});
I.forEach(o=>o.y+=o.v);I=I.filter(o=>{if(o.y>470&&o.y<510&&Math.abs(o.x-px)<48){if(o.r){lives--}else sc++;if(lives<=0){st='over';best=Math.max(best,sc);window.Hub&&Hub.score('basketcatch',sc)}return false}if(o.y>540){if(!o.r){lives--;if(lives<=0){st='over';best=Math.max(best,sc);window.Hub&&Hub.score('basketcatch',sc)}}return false}return true})}
x.clearRect(0,0,400,520);x.font='36px system-ui';x.textAlign='center';I.forEach(o=>x.fillText(o.r?'🪨':o.e,o.x,o.y));x.font='64px system-ui';x.fillText('🧺',px,505);x.fillStyle='#4a2a10';x.font='bold 26px system-ui';x.textAlign='left';x.fillText(sc,14,36);x.textAlign='right';x.fillText('♥'.repeat(Math.max(0,lives)),386,36);
if(st!='play'){x.textAlign='center';x.fillStyle='#000a';x.fillRect(0,200,400,110);x.fillStyle='#fff';x.font='bold 28px system-ui';x.fillText(st=='over'?'Caught '+sc:'Basket Catch',200,248);x.font='15px system-ui';x.fillText('Tap to '+(st=='over'?'retry':'start')+' · best '+best,200,280)}requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
