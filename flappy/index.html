<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flappy Rocket</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>:root{--a:#ff9f43}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1030;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(92vw,360px);border-radius:14px;touch-action:none;cursor:pointer;border:1px solid #ffffff22}</style>
<main><h1>FLAPPY ROCKET</h1><canvas id="c" width="360" height="560"></canvas><p>Click, tap or Space to fire the thrusters. Fly through the gaps!</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d');let y,vy,P,sc,st='ready',t,best=0,stars=Array.from({length:60},()=>[Math.random()*360,Math.random()*560,Math.random()*2]);
function init(){y=250;vy=0;P=[];sc=0;t=0}
function flap(){if(st=='ready'||st=='over'){init();st='play'}vy=-7.2}
c.onpointerdown=flap;onkeydown=e=>{if(e.code=='Space'){e.preventDefault();flap()}};
function die(){st='over';best=Math.max(best,sc);window.Hub&&Hub.score('flappy',sc)}
function step(){stars.forEach(s=>{s[0]-=s[2]*.3;if(s[0]<0)s[0]=360});if(st!='play')return;t++;vy+=.42;y+=vy;const sp=2.6+Math.min(sc*.05,2);
if(t%Math.round(210/sp)==0){const g=Math.max(120,170-sc*2),gy=90+Math.random()*(380-g);P.push({x:380,gy,g,p:0})}
P.forEach(p=>{p.x-=sp;if(!p.p&&p.x+50<70){p.p=1;sc++}if(p.x<95&&p.x+50>45&&(y-12<p.gy||y+12>p.gy+p.g))die()});P=P.filter(p=>p.x>-60);if(y<0||y>560)die()}
init();(function f(){step();x.fillStyle='#0b1030';x.fillRect(0,0,360,560);x.fillStyle='#fff';stars.forEach(s=>x.fillRect(s[0],s[1],s[2],s[2]));
P.forEach(p=>{const gr=x.createLinearGradient(p.x,0,p.x+50,0);gr.addColorStop(0,'#3a4a8c');gr.addColorStop(1,'#6a7fd6');x.fillStyle=gr;x.fillRect(p.x,0,50,p.gy);x.fillRect(p.x,p.gy+p.g,50,560);x.fillStyle='#ff9f43';x.fillRect(p.x-4,p.gy-14,58,14);x.fillRect(p.x-4,p.gy+p.g,58,14)});
x.save();x.translate(70,y);x.rotate(Math.max(-.5,Math.min(.9,vy*.07)));x.fillStyle='#ffd23f';if(st=='play'){x.beginPath();x.moveTo(-16,-4);x.lineTo(-28-Math.random()*8,0);x.lineTo(-16,4);x.fill()}x.fillStyle='#fff';x.shadowColor='#ff9f43';x.shadowBlur=14;x.beginPath();x.moveTo(18,0);x.lineTo(-14,-11);x.lineTo(-14,11);x.closePath();x.fill();x.restore();
x.fillStyle='#fff';x.font='bold 44px system-ui';x.textAlign='center';x.fillText(sc,180,70);
if(st!='play'){x.fillStyle='#000a';x.fillRect(0,210,360,130);x.fillStyle='#fff';x.font='bold 28px system-ui';x.fillText(st=='over'?'Crashed! '+sc:'Flappy Rocket',180,265);x.font='16px system-ui';x.fillText((st=='over'?'Best '+best+' — ':'')+'tap to '+(st=='over'?'retry':'start'),180,300)}requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
