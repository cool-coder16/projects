<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whack-a-Bot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<style>:root{--a:#5cf}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101a2c;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(80vw,330px);margin:12px auto}.h{aspect-ratio:1;border:0;border-radius:50%;background:#1d2b44;font-size:min(14vw,56px);margin:0;padding:0;box-shadow:inset 0 -8px #0006}</style>
<main><h1>WHACK-A-BOT</h1><p>Score <b id="s">0</b> · Time <b id="t">30</b> · Best <b id="b">0</b></p><div id="g"></div><p id="m">Whack the 🤖 bots (+10). Don't hit the 💣 (−20)!</p><button id="go">Start</button></main>
<script>const $=id=>document.getElementById(id);let s=0,run=0,t0,best=0,H=[];
for(let i=0;i<9;i++){const b=document.createElement('button');b.className='h';b.onpointerdown=()=>hit(i);$('g').append(b);H.push({e:b,k:''})}
function hit(i){if(!run)return;const h=H[i];if(h.k=='🤖'){s+=10}else if(h.k=='💣'){s=Math.max(0,s-20)}else s=Math.max(0,s-3);h.k='';h.e.textContent='';$('s').textContent=s}
function pop(){if(!run)return;const i=Math.floor(Math.random()*9),h=H[i];if(!h.k){h.k=Math.random()<.2?'💣':'🤖';h.e.textContent=h.k;setTimeout(()=>{if(h.k){h.k='';h.e.textContent=''}},Math.max(380,900-s*2))}setTimeout(pop,Math.max(260,650-s*1.5))}
$('go').onclick=()=>{s=0;run=1;t0=Date.now();$('s').textContent=0;$('go').style.display='none';pop()};
setInterval(()=>{if(!run)return;const l=Math.max(0,30-(Date.now()-t0)/1000);$('t').textContent=Math.ceil(l);if(l<=0){run=0;H.forEach(h=>{h.k='';h.e.textContent=''});best=Math.max(best,s);$('b').textContent=best;$('m').textContent='Time! Score '+s;$('go').style.display='';$('go').textContent='Play again';window.Hub&&Hub.score('whackbot',s)}},100);</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
