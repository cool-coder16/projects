<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Hop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪂</text></svg>">
<style>:root{--a:#7ee0ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#102a43;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(92vw,360px);border-radius:14px;touch-action:none;cursor:none;border:1px solid #ffffff22}</style>
<main><h1>SKY HOP</h1><canvas id="c" width="360" height="560"></canvas><p>Move the mouse / finger or use ← → to steer. Bounce up as high as you can!</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d');let px,py,vy,pl,cam,top,st='ready',best=0,tx=180,sc=0;
function init(){px=180;py=480;vy=-11;cam=0;top=560;pl=[{x:140,y:520,w:80,m:0}];sc=0;gen()}
function gen(){while(top>cam-80){top-=R(55,95);pl.push({x:R(10,270),y:top,w:R(60,90),m:Math.random()<Math.min(.4,sc/3000)?R(1,2.2):0,d:1})}}
const R=(a,b)=>a+Math.random()*(b-a);
c.onpointermove=e=>{const r=c.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*360};c.onpointerdown=e=>{c.onpointermove(e);if(st!='play'){init();st='play'}};
onkeydown=e=>{if(e.key=='ArrowLeft')tx-=40;if(e.key=='ArrowRight')tx+=40;if(e.code=='Space'&&st!='play'){init();st='play'}};
function step(){if(st!='play')return;px+=(tx-px)*.2;px=Math.max(12,Math.min(348,px));const old=py;vy+=.4;py+=vy;
pl.forEach(p=>{if(p.m){p.x+=p.m*p.d;if(p.x<0||p.x+p.w>360)p.d*=-1}if(vy>0&&old+12<=p.y&&py+12>=p.y&&px>p.x-8&&px<p.x+p.w+8)vy=-11.5});
if(py<cam+240)cam=py-240;sc=Math.max(sc,Math.floor((560-py)/10));gen();pl=pl.filter(p=>p.y<cam+620);
if(py>cam+590){st='over';best=Math.max(best,sc);window.Hub&&Hub.score('skyhop',sc)}}
init();(function f(){step();x.fillStyle=`hsl(${210+Math.min(sc/8,80)},60%,${Math.max(8,22-sc/80)}%)`;x.fillRect(0,0,360,560);
pl.forEach(p=>{const sy=p.y-cam;x.fillStyle=p.m?'#ff9f43':'#7ee0ff';x.shadowColor=x.fillStyle;x.shadowBlur=10;x.fillRect(p.x,sy,p.w,9)});x.shadowBlur=0;
const sy=py-cam;x.fillStyle='#fff';x.beginPath();x.arc(px,sy-4,13,0,7);x.fill();x.fillStyle='#102a43';x.fillRect(px-6,sy-8,4,5);x.fillRect(px+2,sy-8,4,5);
x.fillStyle='#fff';x.font='bold 22px system-ui';x.textAlign='left';x.fillText(sc+' m',14,32);x.textAlign='right';x.fillText('Best '+best,346,32);
if(st!='play'){x.textAlign='center';x.fillStyle='#000a';x.fillRect(0,220,360,120);x.fillStyle='#fff';x.font='bold 28px system-ui';x.fillText(st=='over'?'Fell! '+sc+' m':'Sky Hop',180,272);x.font='16px system-ui';x.fillText('Tap to '+(st=='over'?'retry':'start'),180,305)}requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
