<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ball Run — Endless 3D Roll</title>
<meta name="description" content="Roll a glowing ball down an endless neon track. Dodge blocks, jump gaps, grab gems.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔵</text></svg>">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1033;font-family:system-ui,sans-serif;color:#fff;touch-action:none;user-select:none}
canvas{display:block}
#hud{position:fixed;top:46px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none;font-weight:800;text-shadow:0 2px 12px #000a}
#sc{font-size:clamp(34px,7vw,64px);line-height:1}#hud small{display:block;font-size:13px;font-weight:600;opacity:.7;letter-spacing:.15em}
#ov{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#0000,#0b1033cc);cursor:pointer}
#ov h1{margin:0;font-size:clamp(40px,10vw,100px);font-style:italic;letter-spacing:.06em;background:linear-gradient(#7af,#f6c);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 20px #7af8)}
#ov p{margin:10px 0 0;opacity:.85;font-size:clamp(14px,2.2vw,19px);line-height:1.6}
</style></head><body>
<div id="hud"><div><small>DISTANCE</small><span id="sc">0</span></div><div style="text-align:right"><small>GEMS</small><span id="gm" style="font-size:30px;color:#6ff">0</span><br><small>BEST <b id="bs">0</b></small></div></div>
<div id="ov"><div><h1 id="t">BALL RUN</h1><p id="s">Move the mouse / ← → / A D to steer · Space, W or tap to jump<br>Dodge the red blocks, leap the gaps, grab the gems<br><b>Click to roll</b></p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.random()*(b-a);
let best=0;try{best=+localStorage.getItem('brBest')||0}catch(e){}$('bs').textContent=best;
const ROW=6,FW=7,G=26,JV=9.5;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();const sky=new THREE.Color('#0b1033');scene.background=sky;scene.fog=new THREE.Fog(sky,40,115);
const cam=new THREE.PerspectiveCamera(70,1,.1,300);
const rs=()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};rs();onresize=rs;
scene.add(new THREE.HemisphereLight(0x9ab8ff,0x221144,.9));
const sun=new THREE.DirectionalLight(0xffffff,.9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);const sc2=sun.shadow.camera;sc2.left=-14;sc2.right=14;sc2.top=22;sc2.bottom=-22;sc2.far=80;scene.add(sun,sun.target);
// stars
const sg=new THREE.BufferGeometry(),sp=[];for(let i=0;i<500;i++)sp.push(R(-120,120),R(10,90),R(-140,20));sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.7,fog:false}));scene.add(stars);
// ball
const ball=new THREE.Mesh(new THREE.SphereGeometry(.5,32,24),new THREE.MeshStandardMaterial({color:0x66aaff,emissive:0x2255ff,emissiveIntensity:.8,roughness:.25,metalness:.3}));ball.castShadow=true;
const stripe=new THREE.Mesh(new THREE.TorusGeometry(.5,.05,8,32),new THREE.MeshBasicMaterial({color:0xffffff}));ball.add(stripe);scene.add(ball);
const glow=new THREE.PointLight(0x66aaff,1.2,10);ball.add(glow);
// shared geometry
const BOX=new THREE.BoxGeometry(1,1,1),EDGE=new THREE.EdgesGeometry(BOX),GEM=new THREE.OctahedronGeometry(.4);
const OBS=new THREE.MeshStandardMaterial({color:0xff2f55,emissive:0xaa0022,emissiveIntensity:.7,roughness:.4});
const GMAT=new THREE.MeshStandardMaterial({color:0x66ffee,emissive:0x22ddcc,emissiveIntensity:1,roughness:.2});
// ---- track generation
let rows=new Map(),nextIdx=0,gapLeft=0,landing=0;
function makeRow(i){const d=Math.min(1,i/250),r={i,z:-i*ROW,floor:1,cx:0,w:FW,obs:[],gem:null,objs:[]};
if(i<6){}
else if(gapLeft>0){r.floor=0;gapLeft--;landing=1}
else if(landing){landing=0}
else{const q=Math.random();
 if(q<.10+.10*d){r.floor=0;gapLeft=Math.random()<d*.6?1:0;landing=1}
 else if(q<.55){const n=Math.random()<d*.7?2:1;for(let k=0;k<n;k++){const w=R(1.5,2.6);r.obs.push({x:R(-FW/2+w/2+.2,FW/2-w/2-.2),w})}if(n==2&&Math.abs(r.obs[0].x-r.obs[1].x)<3.2)r.obs.pop()}
 else if(q<.68){r.w=R(3.5,4.8);r.cx=R(-1.2,1.2)}}
if(!r.floor){r.gem={x:0,y:2.4}}else if(Math.random()<.3&&!r.obs.length)r.gem={x:r.cx+R(-r.w/2+.8,r.w/2-.8),y:1.1};
const hue=(0.62+i*.004)%1;
if(r.floor){const m=new THREE.Mesh(BOX,new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(hue,.6,.28),emissive:new THREE.Color().setHSL(hue,.8,.12),roughness:.6}));
 m.scale.set(r.w,.6,ROW-.05);m.position.set(r.cx,-.3,r.z);m.receiveShadow=true;const e=new THREE.LineSegments(EDGE,new THREE.LineBasicMaterial({color:new THREE.Color().setHSL(hue,1,.65)}));m.add(e);r.objs.push(m)}
r.obs.forEach(o=>{const m=new THREE.Mesh(BOX,OBS);m.scale.set(o.w,1.1,1.2);m.position.set(o.x,.55,r.z);m.castShadow=true;r.objs.push(m)});
if(r.gem){const m=new THREE.Mesh(GEM,GMAT);m.position.set(r.gem.x,r.gem.y,r.z);m.userData.gem=1;r.gem.mesh=m;r.objs.push(m)}
r.objs.forEach(o=>scene.add(o));rows.set(i,r)}
function ensure(idx){while(nextIdx<idx+16)makeRow(nextIdx++);for(const[i,r]of rows)if(i<idx-4){r.objs.forEach(o=>{scene.remove(o);if(o.material&&o.material!==OBS&&o.material!==GMAT)o.material.dispose()});rows.delete(i)}}
function clearRows(){for(const r of rows.values())r.objs.forEach(o=>{scene.remove(o);if(o.material&&o.material!==OBS&&o.material!==GMAT)o.material.dispose()});rows.clear();nextIdx=0;gapLeft=0;landing=0}
// ---- game state
let st='ready',x=0,y=.5,z=0,vy=0,tx=0,dist=0,gems=0,spd=0,over=0,shake=0,pieces=[],ac,time=0;
function snd(f,d,type='sine',v=.15){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}
function reset(){clearRows();pieces.forEach(p=>scene.remove(p.m));pieces=[];ball.visible=true;x=tx=0;y=.5;z=0;vy=0;dist=0;gems=0;spd=14;over=0;$('gm').textContent=0;ensure(0)}
function start(){ac=ac||new AudioContext();reset();st='play';$('ov').style.display='none'}
function die(){if(st!='play')return;st='dead';shake=.6;snd(110,.5,'sawtooth',.25);ball.visible=false;for(let i=0;i<24;i++){const m=new THREE.Mesh(BOX,ball.material);m.scale.setScalar(R(.1,.22));m.position.set(x,y,z);scene.add(m);pieces.push({m,v:new THREE.Vector3(R(-5,5),R(2,8),R(-6,3))})}
 const sc=Math.floor(dist);window.Hub&&Hub.score('ballrun',sc);if(sc>best){best=sc;try{localStorage.setItem('brBest',best)}catch(e){}$('bs').textContent=best}
 setTimeout(()=>{$('t').textContent='CRASHED';$('s').innerHTML=`Distance <b>${sc}</b> · Gems <b>${gems}</b> · Best <b>${best}</b><br><b>Click or press Space to roll again</b>`;$('ov').style.display='grid'},900)}
function jump(){if(st=='play'&&y<=.52){vy=JV;snd(520,.18,'triangle',.12)}}
function update(dt){time+=dt;
 if(st=='play'){spd=Math.min(14+dist*.018,34);z-=spd*dt;dist=-z;
  x+=Math.max(-14*dt,Math.min(14*dt,tx-x))*1+0;
  const idx=Math.round(-z/ROW);ensure(idx);const r=rows.get(idx);
  const on=r&&r.floor&&Math.abs(x-r.cx)<r.w/2;
  vy-=G*dt;y+=vy*dt;
  if(on&&y<=.5&&vy<=0){y=.5;vy=0}
  if(y<-7)die();
  for(const k of[idx-1,idx,idx+1]){const q=rows.get(k);if(!q)continue;
   for(const o of q.obs){if(Math.abs(x-o.x)<o.w/2+.4&&Math.abs(z-q.z)<.6+.45&&y<1.55)die()}
   if(q.gem&&q.gem.mesh&&q.gem.mesh.visible&&Math.hypot(x-q.gem.x,y-q.gem.y,z-q.z)<1){q.gem.mesh.visible=false;gems++;$('gm').textContent=gems;snd(900+gems%6*80,.2,'triangle',.12)}}
  ball.position.set(x,y,z);ball.rotation.x-=spd*dt/.5;
  $('sc').textContent=Math.floor(dist)}
 for(const r of rows.values())if(r.gem&&r.gem.mesh){r.gem.mesh.rotation.y+=dt*2;r.gem.mesh.position.y=r.gem.y+Math.sin(time*3+r.i)*.12}
 pieces.forEach(p=>{p.v.y-=20*dt;p.m.position.addScaledVector(p.v,dt);p.m.rotation.x+=dt*6});
 const bz=st=='ready'?-time*6:z,bx=st=='ready'?Math.sin(time)*2:x;
 if(st=='ready'){ensure(Math.round(-bz/ROW));cam.position.set(bx*.5,3.4,bz+7)}else{cam.position.x+=((x*.6)-cam.position.x)*Math.min(1,dt*6);cam.position.y+=((Math.max(y,0)+3.2)-cam.position.y)*Math.min(1,dt*5);cam.position.z=z+7.2}
 cam.fov=70+(spd-14)*.4;cam.updateProjectionMatrix();
 if(shake>0){shake-=dt;cam.position.x+=R(-.15,.15)*shake*3;cam.position.y+=R(-.15,.15)*shake*3}
 cam.lookAt(cam.position.x*.6+(st=='ready'?0:x*.4),.8,bz-9);
 sun.position.set(bx+8,18,bz+6);sun.target.position.set(bx,0,bz-4);
 stars.position.set(0,0,bz);
 renderer.render(scene,cam)}
reset();let last=performance.now();
(function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);requestAnimationFrame(loop)})(last);
// ---- input
const clampX=v=>Math.max(-FW/2+.3,Math.min(FW/2-.3,v));
onpointermove=e=>{tx=clampX((e.clientX/innerWidth-.5)*2*FW*.62)};
onpointerdown=e=>{if(st=='play'){tx=clampX((e.clientX/innerWidth-.5)*2*FW*.62);jump()}else if(!e.target.closest('#pbar'))start()};
onkeydown=e=>{if(['ArrowLeft','a','A'].includes(e.key))tx=clampX(tx-1.4);else if(['ArrowRight','d','D'].includes(e.key))tx=clampX(tx+1.4);
 else if(e.code=='Space'||e.key=='ArrowUp'||e.key=='w'){e.preventDefault();st=='play'?jump():start()}};
</script><style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
