<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pairs — Memory Match</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<style>:root{--a:#5ad1ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12161f;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#bd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(90vw,380px);margin:0 auto 14px;perspective:800px}.k{aspect-ratio:1;position:relative;transform-style:preserve-3d;transition:transform .4s;cursor:pointer}.k.f{transform:rotateY(180deg)}.k b{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;font-size:min(12vw,46px)}.k b:first-child{background:linear-gradient(135deg,#2b3a67,#4a5fa8);font-size:26px;color:#fff6}.k b:last-child{background:#f2f6ff;transform:rotateY(180deg)}.k.m b:last-child{background:#b7ffd0}</style>
<main><h1>PAIRS</h1><div id="bd"></div><p>Moves <b id="mv">0</b> · Time <b id="tm">0</b>s · Best <b id="bs">–</b></p><p id="msg">Flip two cards to find matching pairs.</p><button id="nw">New game</button></main>
<script>const $=id=>document.getElementById(id),E=['🚀','🎸','🍕','🎲','⚽','🎧','💎','🔮'];let op=[],mv,mt,lock,t0,tm,best=0;
function init(){clearInterval(tm);$('tm').textContent=0;t0=0;mv=mt=0;lock=0;op=[];$('mv').textContent=0;$('msg').textContent='Flip two cards to find matching pairs.';
$('bd').innerHTML='';[...E,...E].sort(()=>Math.random()-.5).forEach(e=>{const k=document.createElement('div');k.className='k';k.dataset.e=e;k.innerHTML=`<b>?</b><b>${e}</b>`;k.onclick=()=>flip(k);$('bd').append(k)})}
function flip(k){if(lock||k.classList.contains('f'))return;if(!t0){t0=Date.now();tm=setInterval(()=>$('tm').textContent=Math.floor((Date.now()-t0)/1000),500)}
k.classList.add('f');op.push(k);if(op.length<2)return;mv++;$('mv').textContent=mv;const[a,b]=op;op=[];
if(a.dataset.e==b.dataset.e){a.classList.add('m');b.classList.add('m');if(++mt==8){clearInterval(tm);best=best?Math.min(best,mv):mv;window.Hub&&Hub.score('pairs',mv,true);$('bs').textContent=best;$('msg').textContent=`🎉 All pairs found in ${mv} moves!`}}
else{lock=1;setTimeout(()=>{a.classList.remove('f');b.classList.remove('f');lock=0},800)}}
$('nw').onclick=init;init();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
