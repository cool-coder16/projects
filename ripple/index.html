<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ripple Tank</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
<style>:root{--a:#5ad1ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#02101c;color:#dff6ff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(96vw,640px);border-radius:14px;cursor:crosshair;touch-action:none;image-rendering:auto}input{accent-color:#5ad1ff}</style>
<main><h1>RIPPLE TANK</h1><canvas id="c" width="160" height="100"></canvas><p>Click or drag to make waves — watch them reflect and interfere.<br>Damping <input id="d" type="range" min="0" max="30" value="8"> <button id="au">Auto drops: off</button> <button id="cl">Calm</button></p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id),W=160,H=100,img=x.createImageData(W,H);let a=new Float32Array(W*H),b=new Float32Array(W*H),dn=0,au=0;
const pt=e=>{const r=c.getBoundingClientRect();return[Math.floor((e.clientX-r.left)/r.width*W),Math.floor((e.clientY-r.top)/r.height*H)]};
const drop=(u,v,s=12)=>{for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const i=(v+dy)*W+u+dx;if(u+dx>0&&u+dx<W-1&&v+dy>0&&v+dy<H-1)a[i]=s}};
c.onpointerdown=e=>{dn=1;drop(...pt(e),20);c.setPointerCapture(e.pointerId)};c.onpointerup=()=>dn=0;c.onpointermove=e=>{if(dn)drop(...pt(e))};
$('au').onclick=()=>{au^=1;$('au').textContent='Auto drops: '+(au?'on':'off')};$('cl').onclick=()=>{a.fill(0);b.fill(0)};
(function f(){const k=1-$('d').value/1000;if(au&&Math.random()<.04)drop(5+Math.random()*150|0,5+Math.random()*90|0,18);
for(let s=0;s<2;s++){for(let y=1;y<H-1;y++)for(let i=1;i<W-1;i++){const p=y*W+i;b[p]=((a[p-1]+a[p+1]+a[p-W]+a[p+W])/2-b[p])*k}[a,b]=[b,a]}
for(let p=0;p<W*H;p++){const v=a[p],q=p*4,l=Math.max(0,Math.min(1,.5+v/20));img.data[q]=10+l*l*230;img.data[q+1]=40+l*190;img.data[q+2]=90+l*165;img.data[q+3]=255}x.putImageData(img,0,0);requestAnimationFrame(f)})();</script>
<a href="../" style="position:fixed;right:12px;bottom:12px;z-index:99999;background:#000a;color:#fff;font:600 13px system-ui;padding:8px 14px;border-radius:20px;text-decoration:none;border:1px solid #fff4;backdrop-filter:blur(6px)">🏠 Home</a></body></html>
