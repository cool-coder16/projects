<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keepy Up</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>:root{--a:#6dff9a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f2a1c;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(92vw,400px);border-radius:14px;touch-action:none;cursor:pointer;border:1px solid #ffffff22}</style>
<main><h1>KEEPY UP</h1><canvas id="c" width="400" height="560"></canvas><p>Click or tap the ball to kick it back up. Hit off-center to steer. Don't let it drop!</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d');let b,sc=0,st='ready',best=0,rot=0,pop=[];
function init(){b={x:200,y:180,vx:0,vy:0,r:36};sc=0;pop=[]}
c.onpointerdown=e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*400,my=(e.clientY-r.top)/r.height*560;
if(st!='play'){init();st='play';b.vy=-5;return}if(Math.hypot(mx-b.x,my-b.y)<b.r+14){b.vy=-10.5-Math.min(sc*.05,3);b.vx=(b.x-mx)/b.r*5+b.vx*.3;sc++;pop.push({x:b.x,y:b.y,t:1,s:sc})}};
(function f(){if(st=='play'){b.vy+=.3+Math.min(sc*.004,.15);b.x+=b.vx;b.y+=b.vy;rot+=b.vx*.05;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.8}if(b.x>400-b.r){b.x=400-b.r;b.vx=-Math.abs(b.vx)*.8}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*.5}
if(b.y>560+b.r){st='over';best=Math.max(best,sc);window.Hub&&Hub.score('keepy',sc)}}pop.forEach(p=>{p.t-=.04;p.y-=1});pop=pop.filter(p=>p.t>0);
const g=x.createLinearGradient(0,0,0,560);g.addColorStop(0,'#14402a');g.addColorStop(1,'#0a2216');x.fillStyle=g;x.fillRect(0,0,400,560);
if(b){x.fillStyle='#0006';x.beginPath();x.ellipse(b.x,540,b.r*(1-Math.min(.6,b.y/700)),8,0,0,7);x.fill();x.save();x.translate(b.x,b.y);x.rotate(rot);x.fillStyle='#fff';x.shadowColor='#6dff9a';x.shadowBlur=18;x.beginPath();x.arc(0,0,b.r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#222';for(let i=0;i<5;i++){x.save();x.rotate(i*1.2566);x.beginPath();x.moveTo(0,-b.r*.55);x.lineTo(b.r*.2,-b.r*.35);x.lineTo(0,-b.r*.15);x.lineTo(-b.r*.2,-b.r*.35);x.fill();x.restore()}x.restore()}
pop.forEach(p=>{x.globalAlpha=p.t;x.fillStyle='#ffd23f';x.font='bold 20px system-ui';x.textAlign='center';x.fillText('+1',p.x+30,p.y-30)});x.globalAlpha=1;
x.fillStyle='#fff';x.font='bold 60px system-ui';x.textAlign='center';x.globalAlpha=.9;x.fillText(sc,200,90);x.globalAlpha=1;x.font='16px system-ui';x.fillText('Best '+best,200,116);
if(st!='play'){x.fillStyle='#000a';x.fillRect(0,240,400,120);x.fillStyle='#fff';x.font='bold 28px system-ui';x.fillText(st=='over'?'Dropped! '+sc+' kicks':'Keepy Up',200,292);x.font='16px system-ui';x.fillText('Tap to '+(st=='over'?'retry':'start'),200,326)}requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
