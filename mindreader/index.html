<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Reader — Rock Paper Scissors</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<style>:root{--a:#b28cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14101f;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>.m{font-size:56px;width:100px;height:100px;border-radius:50%;background:#251c3d;margin:8px}.m:hover{transform:scale(1.1)}#bar{height:14px;border-radius:7px;background:#ff5d73;overflow:hidden;margin:10px auto;width:80%}#bar i{display:block;height:100%;background:#4cd97b;width:50%;transition:.3s}</style>
<main><h1>MIND READER</h1><p>This AI learns your habits and tries to predict your next move. Can you be random?</p>
<div><button class="m" data-m="0">✊</button><button class="m" data-m="1">✋</button><button class="m" data-m="2">✌️</button></div>
<div id="msg" style="font-size:22px;min-height:60px"></div><p>You <b id="w">0</b> · AI <b id="a">0</b> · Ties <b id="t">0</b></p><div id="bar"><i></i></div><p>You win share (50% = you're truly random)</p></main>
<script>const $=id=>document.getElementById(id),E=['✊','✋','✌️'];let h=[],T={},w=0,a=0,t=0;
function pred(){for(const n of[3,2,1]){if(h.length<n)continue;const k=h.slice(-n).join(),c=T[k];if(c){const m=c.indexOf(Math.max(...c));if(Math.max(...c)>0)return m}}return Math.floor(Math.random()*3)}
document.querySelectorAll('.m').forEach(b=>b.onclick=()=>{const u=+b.dataset.m,p=pred(),ai=(p+1)%3;for(const n of[1,2,3])if(h.length>=n){const k=h.slice(-n).join();(T[k]=T[k]||[0,0,0])[u]++}h.push(u);
const r=(u-ai+3)%3;let s;if(r==0){t++;s='Tie'}else if(r==1){w++;s='You win! 🎉'}else{a++;s='AI wins 🤖'}
$('msg').innerHTML=`You ${E[u]} vs AI ${E[ai]}<br>${s}`;$('w').textContent=w;$('a').textContent=a;$('t').textContent=t;$('bar').firstChild.style.width=(w+a?w/(w+a)*100:50)+'%'});</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
