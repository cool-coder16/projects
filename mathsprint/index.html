<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Sprint</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>➗</text></svg>">
<style>:root{--a:#ffd23f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12161f;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#q{font-size:min(14vw,64px);font-weight:800;margin:14px 0;font-variant-numeric:tabular-nums}input{font-size:32px;width:180px;text-align:center;background:#1c2230;color:#fff;border:2px solid #ffffff33;border-radius:14px;padding:10px}input:focus{outline:0;border-color:var(--a)}#bar{height:8px;background:#ffffff22;border-radius:4px;margin:10px auto;width:80%;overflow:hidden}#bf{height:100%;background:var(--a);width:100%}.ok{color:#6dff9a}.no{color:#ff7a8a}</style>
<main><h1>MATH SPRINT</h1><p>Score <b id="sc">0</b> · Streak <b id="st">0</b> · Best <b id="bs">0</b></p><div id="bar"><div id="bf"></div></div><div id="q">Ready?</div><input id="a" type="number" inputmode="numeric" autocomplete="off" placeholder="answer"><p id="msg">Type the answer and press Enter. 60 seconds — streaks multiply your points!</p><button id="go">Start</button></main>
<script>const $=id=>document.getElementById(id);let sc,streak,ans,t0,run=0,best=0,lv;
function prob(){const k=Math.min(3,Math.floor(lv/4));const r=n=>Math.floor(Math.random()*n);let a,b,o;const ops=['+','−','×'];o=ops[r(k>0?3:2)];
if(o=='×'){a=2+r(5+k*3);b=2+r(5+k*3);ans=a*b}else if(o=='+'){a=10+r(20+k*80);b=10+r(20+k*80);ans=a+b}else{a=20+r(40+k*80);b=10+r(a-5);ans=a-b}$('q').textContent=`${a} ${o} ${b}`}
function start(){sc=0;streak=0;lv=0;run=1;t0=Date.now();$('go').style.display='none';$('a').disabled=false;$('a').value='';$('a').focus();$('msg').textContent='';prob();upd()}
function upd(){$('sc').textContent=sc;$('st').textContent=streak}
$('a').onkeydown=e=>{if(e.key!='Enter'||!run||$('a').value==='')return;const ok=+$('a').value==ans;if(ok){streak++;lv++;sc+=10+Math.min(streak,10)*2;$('msg').innerHTML='<span class="ok">✓ Correct</span>'}else{streak=0;sc=Math.max(0,sc-5);$('msg').innerHTML='<span class="no">✗ '+ans+'</span>'}$('a').value='';upd();prob()};
setInterval(()=>{if(!run)return;const l=Math.max(0,60-(Date.now()-t0)/1000);$('bf').style.width=l/60*100+'%';if(l<=0){run=0;$('a').disabled=true;best=Math.max(best,sc);$('bs').textContent=best;$('q').textContent='Time!';$('msg').textContent='Final score: '+sc;$('go').style.display='';$('go').textContent='Play again';window.Hub&&Hub.score('mathsprint',sc)}},100);
$('go').onclick=start;$('a').disabled=true;</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
