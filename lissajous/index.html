<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lissajous Lab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>〰️</text></svg>">
<style>:root{--a:#7affd9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070a14;color:#e8f0ff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(94vw,560px);aspect-ratio:1;border-radius:14px;background:#03050a;border:1px solid #ffffff22}.r{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:14px;margin:6px 0}input{accent-color:#7affd9;width:110px}</style>
<main><h1>LISSAJOUS LAB</h1><canvas id="c" width="560" height="560"></canvas><div class="r">A <input id="a" type="range" min="1" max="9" value="3"> B <input id="b" type="range" min="1" max="9" value="2"> Phase <input id="p" type="range" min="0" max="100" value="0"> <label><input type="checkbox" id="an" checked> animate</label></div><p>Two waves at right angles draw beautiful curves. Try different ratios!</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);let ph=0;
(function f(){if($('an').checked)ph+=.012;else ph=+$('p').value/100*6.283;const A=+$('a').value,B=+$('b').value;x.fillStyle='rgba(3,5,10,.25)';x.fillRect(0,0,560,560);x.lineWidth=2;
for(let k=0;k<3;k++){x.strokeStyle=`hsla(${160+k*40},100%,65%,${.9-k*.25})`;x.shadowColor=x.strokeStyle;x.shadowBlur=8;x.beginPath();for(let i=0;i<=1200;i++){const t=i/1200*6.283;const px=280+Math.sin(A*t+ph+k*.06)*240,py=280+Math.sin(B*t)*240;i?x.lineTo(px,py):x.moveTo(px,py)}x.stroke()}x.shadowBlur=0;requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
