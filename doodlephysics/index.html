<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doodle Physics</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>">
<style>:root{--a:#e8563b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf7ee;color:#222;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>h1{text-shadow:none}canvas{width:min(98vw,720px);border-radius:14px;background:#fffdf7;cursor:crosshair;touch-action:none;border:2px solid #222;box-shadow:6px 6px 0 #22222233}</style>
<main><h1>DOODLE PHYSICS</h1><canvas id="c" width="720" height="460"></canvas><div><button id="dr">⚽ Drop balls</button><button id="cb">Clear balls</button><button id="cl">Clear lines</button><label><input type="checkbox" id="au"> drip</label></div><p>Draw ramps, bumpers and funnels with your mouse or finger, then drop balls on them.</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),W=720,H=460,COL=['#e8563b','#3b8be8','#2eb86b','#f5a623','#9b59b6'];let L=[],Bs=[],cur=null,tm=0;
const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]};
c.onpointerdown=e=>{cur=[pt(e)];L.push(cur);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!cur)return;const p=pt(e),q=cur[cur.length-1];if(Math.hypot(p[0]-q[0],p[1]-q[1])>8)cur.push(p)};c.onpointerup=()=>cur=null;
const drop=()=>{for(let i=0;i<6;i++){if(Bs.length>70)Bs.shift();Bs.push({x:80+Math.random()*560,y:-10-i*22,vx:Math.random()*2-1,vy:0,r:9+Math.random()*7,c:COL[Math.floor(Math.random()*5)]})}};
document.getElementById('dr').onclick=drop;document.getElementById('cb').onclick=()=>Bs=[];document.getElementById('cl').onclick=()=>L=[];onkeydown=e=>{if(e.code=='Space'){e.preventDefault();drop()}};
(function f(){if(document.getElementById('au').checked&&++tm%25==0){Bs.length>70&&Bs.shift();Bs.push({x:80+Math.random()*560,y:-10,vx:0,vy:0,r:9+Math.random()*7,c:COL[Math.floor(Math.random()*5)]})}
for(let s=0;s<2;s++)Bs.forEach(b=>{b.vy+=.25;b.x+=b.vx;b.y+=b.vy;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.6}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.6}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.5;b.vx*=.97}
for(const l of L)for(let i=1;i<l.length;i++){const a=l[i-1],q=l[i],dx=q[0]-a[0],dy=q[1]-a[1],ll=dx*dx+dy*dy||1;let u=((b.x-a[0])*dx+(b.y-a[1])*dy)/ll;u=Math.max(0,Math.min(1,u));const px=a[0]+u*dx,py=a[1]+u*dy,ex=b.x-px,ey=b.y-py,d=Math.hypot(ex,ey);
if(d<b.r+2&&d>0){const nx=ex/d,ny=ey/d;b.x=px+nx*(b.r+2);b.y=py+ny*(b.r+2);const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.6*vn*nx;b.vy-=1.6*vn*ny;b.vx*=.99}}}});
x.clearRect(0,0,W,H);x.strokeStyle='#222';x.lineWidth=4;x.lineCap='round';x.lineJoin='round';L.forEach(l=>{x.beginPath();l.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke()});
Bs.forEach(b=>{x.fillStyle=b.c;x.strokeStyle='#222';x.lineWidth=2.5;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.stroke();x.fillStyle='#fff8';x.beginPath();x.arc(b.x-b.r*.3,b.y-b.r*.3,b.r*.25,0,7);x.fill()});requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
