<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chord Garden</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<style>:root{--a:#c9a7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(94vw,640px);border-radius:16px;background:linear-gradient(#0e1530,#1a0f2e);cursor:pointer;touch-action:none;border:1px solid #ffffff22}</style>
<main><h1>CHORD GARDEN</h1><canvas id="c" width="640" height="400"></canvas><p>Touch or drag across the garden to grow notes — everything is tuned so it always sounds beautiful. <label><input type="checkbox" id="au"> dream mode</label></p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),COLS=10,ROWS=5,PEN=[0,2,4,7,9];let ac,mst,F=[],dn=0,cells=Array.from({length:COLS*ROWS},()=>0);
function audio(){if(ac)return;ac=new AudioContext();mst=ac.createGain();mst.gain.value=.5;const d=ac.createDelay(1),fb=ac.createGain();d.delayTime.value=.38;fb.gain.value=.5;mst.connect(ac.destination);mst.connect(d);d.connect(fb);fb.connect(d);d.connect(ac.destination)}
function play(i,j){audio();const deg=PEN[i%5]+12*(Math.floor(i/5)+(ROWS-1-j>>1)),t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=j%2?'triangle':'sine';o.frequency.value=174.6*2**(deg/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+2.2);o.connect(g);g.connect(mst);o.start(t);o.stop(t+2.3);cells[j*COLS+i]=1;F.push({x:(i+.5)*64,y:(j+.5)*80,r:4,h:i*30+j*40,l:1})}
const hit=e=>{const r=c.getBoundingClientRect(),i=Math.floor((e.clientX-r.left)/r.width*COLS),j=Math.floor((e.clientY-r.top)/r.height*ROWS);if(i<0||j<0||i>=COLS||j>=ROWS)return;if(cells[j*COLS+i]<.2)play(i,j)};
c.onpointerdown=e=>{dn=1;hit(e);c.setPointerCapture(e.pointerId)};c.onpointerup=()=>dn=0;c.onpointermove=e=>{if(dn)hit(e)};let tm=0;
(function f(){if(document.getElementById('au').checked&&++tm%22==0)play(Math.floor(Math.random()*COLS),Math.floor(Math.random()*ROWS));x.clearRect(0,0,640,400);
for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){const v=cells[j*COLS+i];cells[j*COLS+i]*=.97;x.fillStyle=`hsla(${i*30+j*40},80%,${40+v*35}%,${.12+v*.6})`;x.shadowColor=`hsl(${i*30+j*40},90%,60%)`;x.shadowBlur=v*26;x.beginPath();x.roundRect(i*64+6,j*80+8,52,64,14);x.fill()}x.shadowBlur=0;
F.forEach(p=>{p.r+=2.2;p.l-=.02;x.strokeStyle=`hsla(${p.h},90%,75%,${Math.max(0,p.l)})`;x.lineWidth=2;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.stroke()});F=F.filter(p=>p.l>0);requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
