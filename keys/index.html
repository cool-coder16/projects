<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keys — Play Piano</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>">
<style>:root{--a:#ff7ab6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14101f;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#pn{position:relative;display:flex;height:200px;margin:20px auto;width:min(92vw,560px)}.w{flex:1;background:#f4f1ff;border-radius:0 0 8px 8px;border:1px solid #888;display:flex;align-items:flex-end;justify-content:center;color:#555;padding-bottom:8px;font-size:12px}.b{position:absolute;width:6%;height:62%;background:#1b1530;border-radius:0 0 6px 6px;color:#aaa;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:11px;z-index:2}.w.on{background:var(--a)}.b.on{background:var(--a);color:#000}select{background:#2a2142;color:#fff;border:0;border-radius:10px;padding:8px}</style>
<main><h1>KEYS</h1><div id="pn"></div><p>Play with your keyboard (A W S E D F T G Y H U J K O L P ;) or tap the keys</p><select id="wv"><option>triangle</option><option>sine</option><option>square</option><option>sawtooth</option></select></main>
<script>const $=id=>document.getElementById(id),K='awsedftgyhujkolp;',NM=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];let ac;const el={};
const blk=s=>[1,3,6,8,10].includes(s%12);let wi=0;const nw=[...Array(17).keys()].filter(s=>!blk(s)).length;
for(let s=0;s<17;s++){const e=document.createElement('div');e.className=blk(s)?'b':'w';e.innerHTML=`${K[s].toUpperCase()}`;e.title=NM[s%12];
if(blk(s))e.style.left=(wi/nw*100-3)+'%';else wi++;e.onpointerdown=()=>on(s);e.onpointerup=e.onpointerleave=()=>off(s);$('pn').append(e);el[s]=e}
function on(s){ac=ac||new AudioContext();if(el[s].on)return;el[s].on=1;el[s].classList.add('on');const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=$('wv').value;o.frequency.value=261.63*2**(s/12);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+1.8);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+1.8)}
function off(s){el[s].on=0;el[s].classList.remove('on')}
onkeydown=e=>{const s=K.indexOf(e.key.toLowerCase());if(s>=0&&!e.repeat&&!e.metaKey&&!e.ctrlKey)on(s)};onkeyup=e=>{const s=K.indexOf(e.key.toLowerCase());if(s>=0)off(s)};</script>
<a href="../" style="position:fixed;left:12px;top:12px;z-index:99999;background:#000a;color:#fff;font:600 13px system-ui;padding:8px 14px;border-radius:20px;text-decoration:none;border:1px solid #fff4;backdrop-filter:blur(6px)">🏠 Home</a></body></html>
