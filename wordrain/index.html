<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Rain</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌧️</text></svg>">
<style>:root{--a:#6fd0ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1426;color:#e8f4ff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(94vw,480px);border-radius:14px;background:linear-gradient(#0b1426,#16294a);border:1px solid #ffffff22}input{font-size:22px;width:min(70vw,300px);text-align:center;background:#16294a;color:#fff;border:2px solid #6fd0ff66;border-radius:12px;padding:10px;margin-top:10px}</style>
<main><h1>WORD RAIN</h1><canvas id="c" width="480" height="520"></canvas><br><input id="a" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type the words"><p>Type a falling word to clear it. Don't let 5 hit the ground!</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),a=document.getElementById('a');
const W='code logic pixel orbit rocket planet cloud river stone flame magic ocean light quick brave dream sugar piano tiger lemon maple frost ember coral amber nova comet laser cyber robot binary vector matrix signal python script engine fusion galaxy meteor quartz zephyr voltage horizon thunder crystal compass network rainbow lantern puzzle shadow marble cactus castle dragon island jungle kernel legend mirror nebula oxygen quiver ribbon summit tunnel velvet wizard yonder'.split(' ');
let D=[],sc=0,lives=5,st='ready',t=0,best=0,pop=[];
function start(){D=[];sc=0;lives=5;t=0;st='play';a.value='';a.focus()}
function over(){st='over';best=Math.max(best,sc);window.Hub&&Hub.score('wordrain',sc)}
a.oninput=()=>{if(st!='play')return;const v=a.value.trim().toLowerCase();const i=D.findIndex(d=>d.w==v);if(i>=0){sc+=D[i].w.length*10+Math.floor(D[i].y/20);pop.push({x:D[i].x,y:D[i].y,t:1,s:'+'+D[i].w.length*10});D.splice(i,1);a.value=''}};
onkeydown=e=>{if(st!='play'&&(e.key=='Enter'||e.key==' ')){e.preventDefault();start()}};c.onpointerdown=()=>{if(st!='play')start()};
(function f(){if(st=='play'){t++;const lv=1+Math.floor(sc/300);if(t%Math.max(40,110-lv*8)==0){const w=W[Math.floor(Math.random()*W.length)];D.push({w,x:20+Math.random()*(440-w.length*14),y:-10,v:.5+lv*.08+Math.random()*.3})}
D.forEach(d=>d.y+=d.v);D=D.filter(d=>{if(d.y>500){lives--;if(lives<=0)over();return false}return true})}
pop.forEach(p=>{p.y-=1;p.t-=.03});pop=pop.filter(p=>p.t>0);
x.clearRect(0,0,480,520);x.font='bold 20px ui-monospace,monospace';x.textAlign='left';const v=a.value.trim().toLowerCase();
D.forEach(d=>{x.fillStyle='#1e3a66';x.fillRect(d.x-6,d.y-20,d.w.length*12.4+12,28);const m=v&&d.w.startsWith(v);x.fillStyle=m?'#6dff9a':'#e8f4ff';x.fillText(d.w,d.x,d.y)});
pop.forEach(p=>{x.globalAlpha=p.t;x.fillStyle='#ffd23f';x.fillText(p.s,p.x,p.y);x.globalAlpha=1});x.fillStyle='#ff5d73';x.fillRect(0,506,480,3);
x.fillStyle='#fff';x.font='bold 18px system-ui';x.fillText('Score '+sc,12,26);x.textAlign='right';x.fillText('♥'.repeat(Math.max(0,lives)),468,26);
if(st!='play'){x.textAlign='center';x.fillStyle='#000a';x.fillRect(0,180,480,140);x.fillStyle='#fff';x.font='bold 30px system-ui';x.fillText(st=='over'?'Game over · '+sc:'Word Rain',240,235);x.font='16px system-ui';x.fillText((st=='over'?'Best '+best+' — ':'')+'press Enter or tap to '+(st=='over'?'retry':'start'),240,272)}requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
