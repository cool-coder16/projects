<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Langton's Ant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐜</text></svg>">
<style>:root{--a:#ff7a59}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f16;color:#e6edf3;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(94vw,640px);aspect-ratio:5/3;image-rendering:pixelated;border-radius:12px;cursor:crosshair;border:1px solid #ffffff22}</style>
<main><h1>LANGTON'S ANT</h1><canvas id="c" width="200" height="120"></canvas><div><button id="pl">⏸ Pause</button><button id="rs">Reset</button> Speed <input id="sp" type="range" min="1" max="200" value="40" style="accent-color:#ff7a59"></div><p>Each ant turns right on a white cell, left on a black one, flips it and moves. Order emerges, then chaos, then a highway! Click to add ants.</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),W=200,H=120,img=x.createImageData(W,H);let g,A,run=1,n=0;
function reset(){g=new Uint8Array(W*H);A=[{x:100,y:60,d:0}];n=0}
c.onpointerdown=e=>{const r=c.getBoundingClientRect();A.push({x:Math.floor((e.clientX-r.left)/r.width*W),y:Math.floor((e.clientY-r.top)/r.height*H),d:Math.floor(Math.random()*4)})};
document.getElementById('pl').onclick=e=>{run^=1;e.target.textContent=run?'⏸ Pause':'▶ Play'};document.getElementById('rs').onclick=reset;reset();
const DX=[0,1,0,-1],DY=[-1,0,1,0];
(function f(){if(run){const k=+document.getElementById('sp').value*5;for(let s=0;s<k;s++)A.forEach(a=>{const p=a.y*W+a.x;a.d=(a.d+(g[p]?3:1))%4;g[p]^=1;a.x=(a.x+DX[a.d]+W)%W;a.y=(a.y+DY[a.d]+H)%H;n++})}
for(let i=0;i<W*H;i++){const q=i*4,v=g[i];img.data[q]=v?255:11;img.data[q+1]=v?122+(i%7)*3:15;img.data[q+2]=v?89:22;img.data[q+3]=255}A.forEach(a=>{const q=(a.y*W+a.x)*4;img.data[q]=255;img.data[q+1]=255;img.data[q+2]=255});x.putImageData(img,0,0);requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
