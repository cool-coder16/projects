<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect Four</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔴</text></svg>">
<style>:root{--a:#ffd23f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1b3a;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#bd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:min(94vw,460px);margin:0 auto 12px;background:#1d4ed8;padding:8px;border-radius:14px}.c{aspect-ratio:1;border-radius:50%;background:#0f1b3a;cursor:pointer;transition:background .15s}.c.R{background:#ff4d6d}.c.Y{background:#ffd23f}.c.w{box-shadow:0 0 0 4px #fff}</style>
<main><h1>CONNECT FOUR</h1><div id="bd"></div><p id="msg">You are red. Click a column — get four in a row!</p><button id="nw">New game</button></main>
<script>const $=id=>document.getElementById(id);let b,over;const idx=(r,c)=>r*7+c;
function init(){b=Array(42).fill('');over=0;$('msg').textContent='You are red. Click a column — get four in a row!';$('bd').innerHTML='';for(let i=0;i<42;i++){const e=document.createElement('div');e.className='c';e.onclick=()=>play(i%7);$('bd').append(e)}}
const drop=(b,c,p)=>{for(let r=5;r>=0;r--)if(!b[idx(r,c)]){b[idx(r,c)]=p;return r}return -1};
function line(b){for(let r=0;r<6;r++)for(let c=0;c<7;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const p=b[idx(r,c)];if(!p)continue;const cs=[];for(let k=0;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>5||cc<0||cc>6||b[idx(rr,cc)]!=p)break;cs.push(idx(rr,cc))}if(cs.length==4)return cs}return null}
function ev(b){let s=0;for(let r=0;r<6;r++)for(let c=0;c<7;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let y=0,R=0;for(let k=0;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>5||cc<0||cc>6){y=R=9;break}const v=b[idx(rr,cc)];if(v=='Y')y++;else if(v=='R')R++}if(!R&&y<9)s+=[0,1,5,40,0][y];if(!y&&R<9)s-=[0,1,6,50,0][R]}for(let r=0;r<6;r++)if(b[idx(r,3)]=='Y')s+=3;return s}
function mm(b,d,a,be,mx){if(line(b))return mx?-1e5-d:1e5+d;if(!d||b.every(Boolean))return ev(b);let best=mx?-Infinity:Infinity;for(const c of[3,2,4,1,5,0,6]){const n=[...b];if(drop(n,c,mx?'Y':'R')<0)continue;const v=mm(n,d-1,a,be,!mx);if(mx){best=Math.max(best,v);a=Math.max(a,v)}else{best=Math.min(best,v);be=Math.min(be,v)}if(a>=be)break}return best}
function fin(){const l=line(b);if(l){over=1;l.forEach(i=>$('bd').children[i].classList.add('w'));$('msg').textContent=b[l[0]]=='R'?'🎉 You win!':'🤖 The AI wins!'}else if(b.every(Boolean)){over=1;$('msg').textContent='Draw!'}return over}
function draw(){b.forEach((v,i)=>$('bd').children[i].className='c '+v)}
function play(c){if(over||drop(b,c,'R')<0)return;draw();if(fin())return;$('msg').textContent='Thinking…';setTimeout(()=>{let bc=3,bv=-Infinity;for(const k of[3,2,4,1,5,0,6]){const n=[...b];if(drop(n,k,'Y')<0)continue;const v=mm(n,5,-Infinity,Infinity,false);if(v>bv){bv=v;bc=k}}drop(b,bc,'Y');draw();if(!fin())$('msg').textContent='Your move!'},30)}
$('nw').onclick=init;init();</script>
<a href="../" style="position:fixed;left:12px;top:12px;z-index:99999;background:#000a;color:#fff;font:600 13px system-ui;padding:8px 14px;border-radius:20px;text-decoration:none;border:1px solid #fff4;backdrop-filter:blur(6px)">🏠 Home</a></body></html>
