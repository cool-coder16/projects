<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orrery — Solar System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
<style>:root{--a:#ffcf6b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#03040a;color:#e8eeff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(98vw,760px);border-radius:14px;background:#02030a;cursor:pointer;border:1px solid #ffffff1a}#info{min-height:70px;background:#ffffff0d;border-radius:12px;padding:12px 16px;margin:10px 0;text-align:left;line-height:1.5}input{accent-color:#ffcf6b}</style>
<main><h1>ORRERY</h1><canvas id="c" width="760" height="460"></canvas><div id="info">Click a planet to learn about it.</div><p>Time speed <input id="sp" type="range" min="0" max="100" value="40"> <b id="d"></b> · <button id="pz">Pause</button></p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);
const P=[['Mercury','#b5b5b5',4,52,88,58,'The smallest planet — a year lasts only 88 Earth days.'],['Venus','#e8cda0',6,76,225,108,'The hottest planet (465°C) and it spins backwards.'],['Earth','#4d9fff',6.5,102,365,150,'Our home: the only known world with life and liquid oceans.'],['Mars','#ff6b4a',5,130,687,228,'Home to Olympus Mons, the tallest volcano in the solar system.'],['Jupiter','#e0b98a',14,178,4333,778,'Its Great Red Spot is a storm bigger than Earth.'],['Saturn','#f0d9a0',12,226,10759,1434,'Its rings are mostly ice — the planet is light enough to float in water.'],['Uranus','#8fe6ee',9,270,30687,2871,'Tilted on its side, it rolls around the Sun.'],['Neptune','#4d6bff',9,312,60190,4495,'Winds reach 2,000 km/h — the fastest in the solar system.']];
const A=P.map(()=>Math.random()*6.28),S=Array.from({length:140},()=>[Math.random()*760,Math.random()*460,Math.random()*1.4]);let sel=-1,pause=0,days=0,pos=[];
c.onpointerdown=e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*760,my=(e.clientY-r.top)/r.height*460;sel=-1;pos.forEach((p,i)=>{if(Math.hypot(mx-p[0],my-p[1])<Math.max(p[2]+8,14))sel=i});
if(sel>=0){const p=P[sel];$('info').innerHTML=`<b style="color:${p[1]}">${p[0]}</b> · Year: ${p[4].toLocaleString()} Earth days · ${p[5].toLocaleString()} million km from the Sun<br>${p[6]}`}};
$('pz').onclick=()=>{pause^=1;$('pz').textContent=pause?'Play':'Pause'};
(function f(){const sp=$('sp').value**2/40;if(!pause){days+=sp/60;P.forEach((p,i)=>A[i]+=6.283*sp/60/p[4])}$('d').textContent=Math.floor(days).toLocaleString()+' days elapsed';
x.fillStyle='#02030a';x.fillRect(0,0,760,460);x.fillStyle='#fff';S.forEach(s=>{x.globalAlpha=.3+.5*Math.abs(Math.sin(days/50+s[0]));x.fillRect(s[0],s[1],s[2],s[2])});x.globalAlpha=1;
const cx=380,cy=230;P.forEach((p,i)=>{x.strokeStyle=sel==i?'#ffffff77':'#ffffff1a';x.beginPath();x.ellipse(cx,cy,p[3],p[3]*.5,0,0,7);x.stroke()});
const g=x.createRadialGradient(cx,cy,2,cx,cy,34);g.addColorStop(0,'#fff6c0');g.addColorStop(.4,'#ffb52e');g.addColorStop(1,'#ff6a0000');x.fillStyle=g;x.beginPath();x.arc(cx,cy,34,0,7);x.fill();
pos=P.map((p,i)=>{const px=cx+Math.cos(A[i])*p[3],py=cy+Math.sin(A[i])*p[3]*.5;return[px,py,p[2]]});
pos.forEach((q,i)=>{const p=P[i];if(i==5){x.strokeStyle='#e8d29088';x.lineWidth=3;x.beginPath();x.ellipse(q[0],q[1],q[2]*1.9,q[2]*.6,-.3,0,7);x.stroke();x.lineWidth=1}
x.fillStyle=p[1];x.shadowColor=p[1];x.shadowBlur=sel==i?22:8;x.beginPath();x.arc(q[0],q[1],q[2],0,7);x.fill();x.shadowBlur=0;
if(i==2){const m=A[2]*12.4;x.fillStyle='#ccc';x.beginPath();x.arc(q[0]+Math.cos(m)*15,q[1]+Math.sin(m)*8,2,0,7);x.fill()}
if(sel==i){x.fillStyle='#fff';x.font='12px system-ui';x.textAlign='center';x.fillText(p[0],q[0],q[1]-q[2]-8)}});requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
