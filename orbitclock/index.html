<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Clock</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕰️</text></svg>">
<style>:root{--a:#ffd23f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05060f;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(94vw,560px);aspect-ratio:1;border-radius:50%;background:radial-gradient(#10163a,#03040a);border:1px solid #ffffff22}</style>
<main><h1>ORBIT CLOCK</h1><canvas id="c" width="560" height="560"></canvas><p>Three planets show the time: the outer circles the hour, the middle the minute, the inner the second.</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),T=6.283;const trail={h:[],m:[],s:[]};
(function f(){const d=new Date(),ms=d.getMilliseconds(),s=d.getSeconds()+ms/1000,m=d.getMinutes()+s/60,h=(d.getHours()%12)+m/60;x.clearRect(0,0,560,560);
const g=x.createRadialGradient(280,280,2,280,280,34);g.addColorStop(0,'#fff6c0');g.addColorStop(.5,'#ffb52e');g.addColorStop(1,'#ff6a0000');x.fillStyle=g;x.beginPath();x.arc(280,280,34,0,7);x.fill();
[['s',110,s/60,'#6fd0ff',9],['m',170,m/60,'#ff7ab6',12],['h',240,h/12,'#ffd23f',16]].forEach(([k,r,fr,col,pr])=>{x.strokeStyle='#ffffff1c';x.lineWidth=1;x.beginPath();x.arc(280,280,r,0,7);x.stroke();for(let i=0;i<(k=='h'?12:60);i++){const a=i/(k=='h'?12:60)*T-1.5708;x.fillStyle='#ffffff40';x.fillRect(280+Math.cos(a)*r-1,280+Math.sin(a)*r-1,k=='h'?4:2,k=='h'?4:2)}
const a=fr*T-1.5708,px=280+Math.cos(a)*r,py=280+Math.sin(a)*r;const tr=trail[k];tr.push([px,py]);if(tr.length>50)tr.shift();tr.forEach((p,i)=>{x.fillStyle=col+Math.floor(i/50*70).toString(16).padStart(2,'0');x.beginPath();x.arc(p[0],p[1],pr*.4*(i/50),0,7);x.fill()});
x.fillStyle=col;x.shadowColor=col;x.shadowBlur=18;x.beginPath();x.arc(px,py,pr,0,7);x.fill();x.shadowBlur=0});
x.fillStyle='#fff';x.font='bold 28px ui-monospace,monospace';x.textAlign='center';x.fillText(d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}),280,545);requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
