<!doctype html><html lang="en"><head><script src="../settings.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo — Memory Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>">
<style>:root{--a:#7c5cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12101c;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#bd{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(80vw,360px);margin:0 auto 14px}.p{aspect-ratio:1;border:0;border-radius:22px;opacity:.4;transition:.12s;margin:0}.p.lit{opacity:1;transform:scale(1.05);box-shadow:0 0 40px currentColor}</style>
<main><h1>ECHO</h1><div id="bd"></div><p id="msg">Watch the pattern, then repeat it.</p><p>Level <b id="lv">0</b> · Best <b id="bs">0</b></p><button id="go">Start</button></main>
<script>const $=id=>document.getElementById(id),C=['#ff4d6d','#ffd23f','#2ecc71','#3da5ff'],F=[262,330,392,523];let seq=[],i=0,lock=1,best=0,ac;
C.forEach((c,k)=>{const e=document.createElement('button');e.className='p';e.style.background=e.style.color=c;e.onpointerdown=()=>tap(k);$('bd').append(e)});
const el=k=>$('bd').children[k];
function beep(k,d=.3){ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=F[k];g.gain.setValueAtTime(.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
function flash(k){el(k).classList.add('lit');beep(k);setTimeout(()=>el(k).classList.remove('lit'),280)}
async function play(){lock=1;$('msg').textContent='Watch…';await new Promise(r=>setTimeout(r,700));for(const k of seq){flash(k);await new Promise(r=>setTimeout(r,520-Math.min(seq.length*12,260)))}i=0;lock=0;$('msg').textContent='Your turn!'}
function tap(k){if(lock)return;flash(k);if(k!=seq[i]){lock=1;$('msg').textContent='Oops! Wrong one. Press Start to retry.';$('go').textContent='Retry';return}
if(++i==seq.length){$('lv').textContent=seq.length;best=Math.max(best,seq.length);$('bs').textContent=best;seq.push(Math.floor(Math.random()*4));play()}}
$('go').onclick=()=>{seq=[Math.floor(Math.random()*4)];$('lv').textContent=0;$('go').textContent='Restart';play()};</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
