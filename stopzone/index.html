<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stop Zone</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎚️</text></svg>">
<style>:root{--a:#6dff9a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12161f;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(94vw,520px);border-radius:14px;background:#0a0d14;touch-action:none;cursor:pointer;border:1px solid #ffffff22}</style>
<main><h1>STOP ZONE</h1><canvas id="c" width="520" height="220"></canvas><p>Click, tap or press Space to stop the bar inside the green zone. Each hit makes the zone smaller and the bar faster.</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d');let pos=0,dir=1,sp=5,zone=130,zx=200,st='ready',sc=0,best=0,flash=0;
function nz(){zx=20+Math.random()*(480-zone)}
function hit(){if(st!='play'){sc=0;zone=130;sp=5;pos=0;nz();st='play';return}if(pos>=zx&&pos<=zx+zone){sc++;flash=1;zone=Math.max(18,zone*.9);sp*=1.07;nz()}else{st='over';best=Math.max(best,sc);window.Hub&&Hub.score('stopzone',sc)}}
c.onpointerdown=hit;onkeydown=e=>{if(e.code=='Space'){e.preventDefault();hit()}};nz();
(function f(){if(st=='play'){pos+=dir*sp;if(pos>520){pos=520;dir=-1}if(pos<0){pos=0;dir=1}}flash*=.9;x.fillStyle='#0a0d14';x.fillRect(0,0,520,220);x.fillStyle=flash>.3?'#b6ffcc':'#2ecc71';x.fillRect(zx,90,zone,50);x.fillStyle='#ffffff18';x.fillRect(0,100,520,30);
x.fillStyle='#fff';x.shadowColor='#fff';x.shadowBlur=14;x.fillRect(pos-4,70,8,90);x.shadowBlur=0;x.font='bold 30px system-ui';x.textAlign='left';x.fillText(sc,16,46);x.font='14px system-ui';x.textAlign='right';x.fillText('Best '+best,504,42);
if(st!='play'){x.textAlign='center';x.fillStyle='#000a';x.fillRect(0,170,520,50);x.fillStyle='#fff';x.font='bold 18px system-ui';x.fillText(st=='over'?'Missed! Streak '+sc+' — tap to retry':'Tap to start',260,202)}requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
