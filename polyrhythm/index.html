<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polyrhythm Circles</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎶</text></svg>">
<style>:root{--a:#7cf}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07091a;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(94vw,560px);border-radius:50%;background:radial-gradient(#10163a,#05060f);cursor:pointer;border:1px solid #ffffff1a}</style>
<main><h1>POLYRHYTHM</h1><canvas id="c" width="560" height="560"></canvas><p id="m">Click to start. Each ring's dot plays a note every lap — slightly different speeds drift in and out of sync.</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),N=10,PEN=[0,2,4,7,9];let ac,t0=0,run=0,last=Array(N).fill(0),fl=Array(N).fill(0);
const fr=i=>220*2**((PEN[i%5]+12*Math.floor(i/5))/12);
function tone(i){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='sine';o.frequency.value=fr(i);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+1.4);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.4)}
c.onclick=()=>{if(!run){ac=new AudioContext();t0=performance.now();run=1;document.getElementById('m').textContent='Listening… click to pause.'}else{run=0;document.getElementById('m').textContent='Paused — click to resume.'}};
(function f(now){x.clearRect(0,0,560,560);const t=run?(now-t0)/1000:0;
for(let i=0;i<N;i++){const r=50+i*24,laps=t*(20+i)/60,a=laps*6.283-1.5708;if(run&&Math.floor(laps)>last[i]){last[i]=Math.floor(laps);fl[i]=1;tone(i)}fl[i]*=.93;
x.strokeStyle=`hsla(${200+i*14},90%,70%,${.18+fl[i]*.6})`;x.lineWidth=2+fl[i]*4;x.beginPath();x.arc(280,280,r,0,7);x.stroke();
const px=280+Math.cos(a)*r,py=280+Math.sin(a)*r;x.fillStyle=`hsl(${200+i*14},100%,${65+fl[i]*25}%)`;x.shadowColor=x.fillStyle;x.shadowBlur=10+fl[i]*24;x.beginPath();x.arc(px,py,6+fl[i]*6,0,7);x.fill();x.shadowBlur=0}
x.strokeStyle='#ffffff40';x.beginPath();x.moveTo(280,30);x.lineTo(280,280);x.stroke();requestAnimationFrame(f)})(0);</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
