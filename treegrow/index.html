<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wind Tree</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
<style>:root{--a:#ff9ec7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101a2e;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(98vw,720px);border-radius:14px;background:linear-gradient(#1a2a4a,#3b4f7a 70%,#243b2b);border:1px solid #ffffff22}.r{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:14px;margin:8px 0}input{accent-color:#ff9ec7}</style>
<main><h1>WIND TREE</h1><canvas id="c" width="720" height="460"></canvas><div class="r">Spread <input id="sp" type="range" min="10" max="60" value="28"> Depth <input id="dp" type="range" min="4" max="11" value="9"> Shrink <input id="sh" type="range" min="60" max="82" value="73"> Wind <input id="wd" type="range" min="0" max="10" value="4"><button id="rn">🎲 New tree</button></div></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);let t=0,seed=1;
const jit=(i,d)=>Math.sin(i*12.9898+d*78.233+seed*3.1)*.5;
function br(px,py,len,ang,d,i,D,sp,sh,wd){const sw=Math.sin(t*1.3+d*.5+i)*wd*.0035*(D-d+1),a=ang+sw,nx=px+Math.sin(a)*len,ny=py-Math.cos(a)*len;x.lineWidth=Math.max(1,(D-d)*1.6);x.strokeStyle=d<D*.6?`rgb(${70+d*8},${48+d*5},35)`:`hsl(${110+d*3},50%,${30+d*2}%)`;x.beginPath();x.moveTo(px,py);x.lineTo(nx,ny);x.stroke();
if(d>=D-1){x.fillStyle=`hsla(${330+jit(i,d)*40},90%,${78+jit(i,3)*14}%,.85)`;x.beginPath();x.arc(nx,ny,3.2,0,7);x.fill();return}
const s=sp*Math.PI/180;br(nx,ny,len*sh*(1+jit(i,d)*.12),a-s*(1+jit(i,d+1)*.5),d+1,i*2,D,sp,sh,wd);br(nx,ny,len*sh*(1+jit(i+1,d)*.12),a+s*(1+jit(i+1,d+1)*.5),d+1,i*2+1,D,sp,sh,wd)}
(function f(){t+=.016;x.clearRect(0,0,720,460);x.lineCap='round';const D=+$('dp').value;br(360,450,92,0,0,1,D,+$('sp').value,+$('sh').value/100,+$('wd').value);requestAnimationFrame(f)})();$('rn').onclick=()=>seed=Math.random()*50;</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
