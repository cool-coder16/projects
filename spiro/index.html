<!doctype html><html lang="en"><head><script src="../settings.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spiro — Spirograph</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
<style>:root{--a:#7af}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07060f;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(94vw,560px);aspect-ratio:1;border-radius:50%;background:#000;box-shadow:0 0 60px #6a5cff44}.r{display:flex;align-items:center;gap:8px;justify-content:center;font-size:14px}input{accent-color:#7af}</style>
<main><h1>SPIRO</h1><canvas id="c" width="560" height="560"></canvas>
<div class="r">Big ring <input id="R" type="range" min="40" max="200" value="150"> Small <input id="r" type="range" min="10" max="150" value="47"> Pen <input id="d" type="range" min="5" max="160" value="80"></div>
<button id="rn">🎲 Random</button><button id="rd">Redraw</button><p>Drag the sliders to design your own pattern.</p></main>
<script>const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d');let t,px,py,end;
const gcd=(a,b)=>b?gcd(b,a%b):a;
function pt(t){const R=+$('R').value,r=+$('r').value,d=+$('d').value,k=(R-r)/r,s=250/(Math.abs(R-r)+d);return[280+s*((R-r)*Math.cos(t)+d*Math.cos(k*t)),280+s*((R-r)*Math.sin(t)-d*Math.sin(k*t))]}
function reset(){x.globalCompositeOperation='source-over';x.shadowBlur=0;x.fillStyle='#000';x.fillRect(0,0,560,560);t=0;[px,py]=pt(0);const R=+$('R').value,r=+$('r').value;end=2*Math.PI*r/gcd(R,r)}
function f(){x.globalCompositeOperation='lighter';x.lineWidth=1.4;for(let i=0;i<25&&t<end;i++){t+=.03;const[a,b]=pt(t);x.strokeStyle=`hsl(${t*18%360},100%,60%)`;x.shadowColor=x.strokeStyle;x.shadowBlur=6;x.beginPath();x.moveTo(px,py);x.lineTo(a,b);x.stroke();px=a;py=b}requestAnimationFrame(f)}
['R','r','d'].forEach(i=>$(i).oninput=reset);$('rd').onclick=reset;$('rn').onclick=()=>{$('R').value=60+Math.floor(Math.random()*140);$('r').value=10+Math.floor(Math.random()*120);$('d').value=10+Math.floor(Math.random()*140);reset()};reset();f();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
