<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drum Pads</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥁</text></svg>">
<style>:root{--a:#ff7ab6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14101f;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(90vw,440px);margin:14px auto}.p{aspect-ratio:1;border:0;border-radius:16px;background:#2a2142;color:#fff;font-size:15px;font-weight:700;margin:0;padding:6px;transition:.08s}.p.on{background:var(--a);color:#000;transform:scale(.94);box-shadow:0 0 30px var(--a)}.p small{display:block;opacity:.6;font-size:12px}</style>
<main><h1>DRUM PADS</h1><div id="g"></div><p>Tap the pads or press the keys shown. Make your own beat!</p></main>
<script>let ac,nz;const P=[['Kick','A'],['Snare','S'],['Hat','D'],['Clap','F'],['Tom','J'],['Rim','K'],['Cowbell','L'],['Crash',';']];const els=[];
const noise=d=>{if(!nz){nz=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const a=nz.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const s=ac.createBufferSource();s.buffer=nz;return s};
function hitSound(i){ac=ac||new AudioContext();const t=ac.currentTime,g=ac.createGain();g.connect(ac.destination);const o=(type,f1,f2,d,v)=>{const q=ac.createOscillator();q.type=type;q.frequency.setValueAtTime(f1,t);q.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);q.connect(g);q.start(t);q.stop(t+d)};
const n=(ft,fq,d,v)=>{const s=noise(),f=ac.createBiquadFilter();f.type=ft;f.frequency.value=fq;s.connect(f);f.connect(g);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.start(t);s.stop(t+d)};
[()=>o('sine',150,40,.35,.9),()=>{n('highpass',1500,.2,.5);o('triangle',200,100,.1,.4)},()=>n('highpass',7000,.06,.35),()=>{n('bandpass',1500,.18,.7)},()=>o('sine',220,90,.3,.7),()=>o('square',900,800,.05,.25),()=>{o('square',560,540,.25,.2);o('square',845,800,.25,.2)},()=>n('highpass',5000,.9,.4)][i]()}
function hit(i){hitSound(i);els[i].classList.add('on');setTimeout(()=>els[i].classList.remove('on'),110)}
P.forEach(([n,k],i)=>{const b=document.createElement('button');b.className='p';b.innerHTML=n+'<small>'+k+'</small>';b.onpointerdown=()=>hit(i);document.getElementById('g').append(b);els.push(b)});
onkeydown=e=>{if(e.repeat)return;const i=P.findIndex(p=>p[1]==e.key.toUpperCase());if(i>=0)hit(i)};</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
