<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Count</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
<style>:root{--a:#ffd23f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1a2a;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(92vw,420px);border-radius:14px;background:#0a1220;border:1px solid #ffffff22}.o{width:76px;height:60px;font-size:26px;margin:6px}</style>
<main><h1>QUICK COUNT</h1><p>Correct <b id="s">0</b> · Best <b id="b">0</b></p><canvas id="c" width="420" height="260"></canvas><div id="o"></div><p id="m">Dots flash for a moment — how many were there?</p><button id="go">Start</button></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);let s=0,n,lock=1,best=0;
function round(){const mx=Math.min(30,5+s*2);n=3+Math.floor(Math.random()*(mx-2));x.clearRect(0,0,420,260);const P=[];while(P.length<n){const p=[20+Math.random()*380,20+Math.random()*220];if(P.every(q=>Math.hypot(p[0]-q[0],p[1]-q[1])>28))P.push(p)}
x.fillStyle='#ffd23f';P.forEach(p=>{x.beginPath();x.arc(p[0],p[1],8,0,7);x.fill()});$('o').innerHTML='';lock=1;setTimeout(()=>{x.clearRect(0,0,420,260);x.fillStyle='#fff6';x.font='60px system-ui';x.textAlign='center';x.fillText('?',210,150);
const sp=Math.max(1,3-Math.floor(s/4)),O=new Set([n]);while(O.size<4)O.add(Math.max(1,n+Math.floor(Math.random()*7-3)*sp||n+1));[...O].sort(()=>Math.random()-.5).forEach(v=>{const b=document.createElement('button');b.className='o';b.textContent=v;b.onclick=()=>pick(v);$('o').append(b)});lock=0},900+n*45)}
function pick(v){if(lock)return;lock=1;if(v==n){s++;$('s').textContent=s;$('m').textContent='Correct!';setTimeout(round,500)}else{best=Math.max(best,s);$('b').textContent=best;$('m').textContent='It was '+n+'. You got '+s+' right.';$('go').style.display='';$('go').textContent='Play again';window.Hub&&Hub.score('quickcount',s)}}
$('go').onclick=()=>{s=0;$('s').textContent=0;$('go').style.display='none';$('m').textContent='Watch closely…';round()};</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
