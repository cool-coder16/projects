<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chicken Jump</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐔</text></svg>">
<style>:root{--a:#ffb02e}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#16324a;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(98vw,720px);border-radius:14px;touch-action:none;cursor:pointer;border:1px solid #ffffff22}button.o{background:#ffffff22;color:#fff}button.o.s{background:var(--a);color:#000}</style>
<main><h1>CHICKEN JUMP</h1><div><button class="o s" id="m1">1 Player</button><button class="o" id="m2">2 Players</button></div><canvas id="c" width="720" height="400"></canvas><p id="hint"></p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id),GY=250,G=.4,V=12,TOL=22,A=150;
let mode=1,st='ready',ch=[],phi=0,om=.0515,omc=.0515,W=150,moving=0,half=0,fx=[],pops=[],t=0,best=0,msg='',shake=0;
const R=(a,b)=>a+Math.random()*(b-a),off=()=>A*Math.sin(phi);
function init(){W=150;om=omc=.0515;phi=0;half=0;moving=0;t=0;fx=[];pops=[];msg='';ch=(mode==1?[360]:[180,540]).map(bc=>({bc,y:GY,vy:0,air:0,buf:0,pts:0,fall:0,dir:0,rot:0}));
$('hint').textContent=mode==1?'Tap, click or press Space to jump. The block swings under you — jump at the right moment so you land with it CENTERED for a point. Do not jump and it knocks you off!':'2 players, same block, separate panels: P1 = Space or left half of the screen · P2 = Enter or right half. Land centered to score — first to 10, or last chicken standing, wins!'}
function press(i){if(st!='play'){init();st='play'}const k=ch[i];if(!k||k.fall)return;moving=1;if(!k.air){k.vy=-V;k.air=1}else k.buf=9}
function pop(px,s,col){pops.push({x:px,y:GY-90,s,col,t:1})}
function burst(px,py,n){for(let i=0;i<n;i++)fx.push({x:px,y:py,vx:R(-4,4),vy:R(-6,-1),l:1})}
function finish(win){st='over';if(mode==1){best=Math.max(best,ch[0].pts);window.Hub&&Hub.score('chickenjump',ch[0].pts);msg='Knocked off! Score '+ch[0].pts}else msg=win<0?'Draw!':'Player '+(win+1)+' wins!'}
function step(){t++;if(st!='play')return;
if(moving){const h=Math.floor(phi/Math.PI);if(h!=half){half=h;omc=om*(1-R(0,Math.min(.14,.02+.012*Math.max(...ch.map(k=>k.pts)))))}phi+=omc}
const d=off();
ch.forEach(k=>{if(k.fall){k.vy+=G;k.y+=k.vy;k.bc+=k.dir*3;k.rot+=.22*k.dir;return}
 if(k.buf>0)k.buf--;const on=Math.abs(d)<W/2;
 if(k.air){k.vy+=G;k.y+=k.vy;if(k.vy>0&&k.y>=GY){if(on){k.y=GY;k.vy=0;k.air=0;const e=Math.abs(d);
   if(e<=TOL){k.pts++;pop(k.bc,e<6?'PERFECT! +1':'CENTERED +1','#ffe27a');burst(k.bc,GY,12);W=Math.max(104,W-2)}else pop(k.bc,'off-center','#fff');
   if(k.buf>0){k.vy=-V;k.air=1;k.buf=0}}else{k.fall=1;k.dir=d<0?1:-1;k.vy=-3;shake=8}}}
 else if(!on){k.fall=1;k.dir=d<0?1:-1;k.vy=-5;shake=8}});
const w=mode==2?ch.findIndex(k=>k.pts>=10):-1;
if(w>=0)finish(w);else if(mode==1){if(ch[0].fall&&ch[0].y>GY+150)finish(0)}else if(ch.some(k=>k.fall)&&ch.every(k=>!k.fall||k.y>GY+150)){const a=ch.filter(k=>!k.fall);finish(a.length==1?ch.indexOf(a[0]):ch[0].pts==ch[1].pts?-1:ch[0].pts>ch[1].pts?0:1)}
fx.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l-=.035});fx=fx.filter(p=>p.l>0);pops.forEach(p=>{p.y-=.8;p.t-=.02});pops=pops.filter(p=>p.t>0);if(shake>0)shake--}
$('m1').onclick=()=>{mode=1;$('m1').className='o s';$('m2').className='o';st='ready';init()};$('m2').onclick=()=>{mode=2;$('m2').className='o s';$('m1').className='o';st='ready';init()};
c.onpointerdown=e=>{const r=c.getBoundingClientRect();press(mode==2&&(e.clientX-r.left)/r.width>.5?1:0)};
onkeydown=e=>{if(e.repeat)return;if(e.code=='Space'||e.key=='w'||e.key=='W'){e.preventDefault();press(0)}else if(e.key=='Enter'||e.key=='ArrowUp'){e.preventDefault();press(mode==2?1:0)}};
init();(function f(){step();x.save();if(shake)x.translate(R(-3,3),R(-3,3));
const g=x.createLinearGradient(0,0,0,400);g.addColorStop(0,'#5fb8ff');g.addColorStop(.6,'#bfe6ff');g.addColorStop(1,'#0d2a4a');x.fillStyle=g;x.fillRect(-5,-5,730,410);
x.fillStyle='#ffffffcc';for(let i=0;i<4;i++){const cx=((i*230-t*.3)%900+900)%900-90,cy=50+i*28;x.beginPath();x.arc(cx,cy,24,0,7);x.arc(cx+28,cy+6,30,0,7);x.arc(cx+58,cy,22,0,7);x.fill()}
x.fillStyle='#0b2a4aaa';x.fillRect(-5,GY+44,730,160);x.fillStyle='#ffffff14';for(let i=0;i<10;i++)x.fillRect(((i*90+t*.8)%760)-20,GY+70+(i%3)*28,50,3);
const d=off();ch.forEach((k,i)=>{const px=mode==1?0:i*360,pw=mode==1?720:360;x.save();x.beginPath();x.rect(px,0,pw,400);x.clip();const bx=(mode==1?360:180+i*360)+d;
 const bg=x.createLinearGradient(0,GY,0,GY+42);bg.addColorStop(0,'#ffd36b');bg.addColorStop(1,'#e08a1e');x.fillStyle=bg;x.shadowColor='#ffb02e';x.shadowBlur=12;x.beginPath();x.roundRect(bx-W/2,GY,W,42,10);x.fill();x.shadowBlur=0;
 x.fillStyle='#fff9';x.fillRect(bx-3,GY+4,6,34);x.fillStyle='#7a4a0a55';for(let j=-3;j<=3;j++)if(j)x.fillRect(bx+j*W/8-1,GY+10,2,22);
 x.strokeStyle='#ffffff30';x.setLineDash([4,6]);x.beginPath();x.moveTo(mode==1?360:180+i*360,GY-140);x.lineTo(mode==1?360:180+i*360,GY+2);x.stroke();x.setLineDash([]);
 x.save();x.translate(k.bc,k.y-26);x.scale(-1,1);x.rotate(k.fall?k.rot:Math.max(-.25,Math.min(.3,-k.vy*.02)));x.font='56px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('🐔',0,0);x.restore();
 if(mode==2){x.font='bold 14px system-ui';x.fillStyle=i?'#ff5d73':'#4dc3ff';x.textAlign='center';x.fillText('P'+(i+1)+'  ·  '+k.pts,k.bc,GY-110)}x.restore()});
if(mode==2){x.strokeStyle='#ffffff55';x.beginPath();x.moveTo(360,0);x.lineTo(360,400);x.stroke()}
fx.forEach(p=>{x.fillStyle=`rgba(255,226,122,${p.l})`;x.fillRect(p.x,p.y,5,5)});pops.forEach(p=>{x.globalAlpha=p.t;x.fillStyle=p.col;x.font='bold 20px system-ui';x.textAlign='center';x.fillText(p.s,p.x,p.y)});x.globalAlpha=1;
x.restore();x.textBaseline='alphabetic';x.fillStyle='#fff';x.textAlign='center';if(mode==1){x.textAlign='left';x.font='bold 44px system-ui';x.fillText(ch[0].pts,22,58);x.font='15px system-ui';x.fillText('Best '+best,22,82)}
if(st!='play'){x.fillStyle='#000b';x.fillRect(0,130,720,140);x.fillStyle='#fff';x.font='bold 32px system-ui';x.fillText(st=='over'?msg:'Chicken Jump',360,185);x.font='17px system-ui';x.fillText('Tap or press '+(mode==2?'Space / Enter':'Space')+' to '+(st=='over'?'play again':'start'),360,225)}
requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
