<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tap Speed</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👆</text></svg>">
<style>:root{--a:#4dd0ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101826;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#pad{width:min(76vw,300px);height:min(76vw,300px);border-radius:50%;font-size:44px;font-weight:900;background:var(--a);border:0;box-shadow:0 0 40px var(--a);margin:10px;touch-action:manipulation}#pad:active{transform:scale(.95)}</style>
<main><h1>TAP SPEED</h1><p>Taps <b id="n">0</b> · Time <b id="t">10.0</b>s · Best <b id="b">0</b></p><button id="pad">TAP!</button><p id="m">Tap as fast as you can for 10 seconds. The clock starts on your first tap.</p></main>
<script>const $=id=>document.getElementById(id);let n=0,t0=0,run=0,best=0,iv;
$('pad').onpointerdown=()=>{if(!run){n=0;run=1;t0=Date.now();iv=setInterval(()=>{const l=Math.max(0,10-(Date.now()-t0)/1000);$('t').textContent=l.toFixed(1);if(l<=0){clearInterval(iv);run=0;best=Math.max(best,n);$('b').textContent=best;$('m').textContent='Time! '+n+' taps ('+(n/10).toFixed(1)+'/s). Tap to play again.';window.Hub&&Hub.score('tapspeed',n)}},50)}if(run){n++;$('n').textContent=n}};</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
