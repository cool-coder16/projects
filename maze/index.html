<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lantern Maze</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕯️</text></svg>">
<style>:root{--a:#ffb347}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0b12;color:#ffe9b8;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(94vw,520px);border-radius:12px;border:1px solid #ffb34755;touch-action:none}</style>
<main><h1>LANTERN MAZE</h1><canvas id="c" width="520" height="520"></canvas><p>Level <b id="lv">1</b> · Time <b id="tm">0</b>s · Arrow keys / WASD / swipe · Find the glowing exit in the dark</p></main>
<script>const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d');let N,Z,m,px,py,level=1,t0,fin=0,trail;
function gen(){N=7+level*2;if(N>25)N=25;Z=520/N;m=[...Array(N*N)].map(()=>15);const seen=new Set([0]),st=[0];while(st.length){const i=st.at(-1),X=i%N,Y=Math.floor(i/N),o=[[1,0,1,4],[-1,0,4,1],[0,1,2,8],[0,-1,8,2]].filter(([dx,dy])=>X+dx>=0&&Y+dy>=0&&X+dx<N&&Y+dy<N&&!seen.has((Y+dy)*N+X+dx));
if(!o.length){st.pop();continue}const[dx,dy,a,b]=o[Math.floor(Math.random()*o.length)],j=(Y+dy)*N+X+dx;m[i]&=~a;m[j]&=~b;seen.add(j);st.push(j)}px=py=0;trail=[[0,0]];t0=Date.now();fin=0;$('lv').textContent=level}
// wall bits: 1=right 2=down 4=left 8=up
function draw(){x.fillStyle='#14101c';x.fillRect(0,0,520,520);x.strokeStyle='#ffd58a';x.lineWidth=2.5;x.lineCap='round';x.beginPath();
for(let i=0;i<N*N;i++){const a=(i%N)*Z,b=Math.floor(i/N)*Z;if(m[i]&1){x.moveTo(a+Z,b);x.lineTo(a+Z,b+Z)}if(m[i]&2){x.moveTo(a,b+Z);x.lineTo(a+Z,b+Z)}if(m[i]&4){x.moveTo(a,b);x.lineTo(a,b+Z)}if(m[i]&8){x.moveTo(a,b);x.lineTo(a+Z,b)}}x.stroke();
x.fillStyle='#ffb34744';trail.forEach(([a,b])=>x.fillRect(a*Z+Z*.3,b*Z+Z*.3,Z*.4,Z*.4));
const t=Date.now()/300,ex=(N-1)*Z+Z/2,g=x.createRadialGradient(ex,ex,0,ex,ex,Z*(.9+.15*Math.sin(t)));g.addColorStop(0,'#6dff9a');g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(ex-Z,ex-Z,Z*2,Z*2);
const cx=px*Z+Z/2,cy=py*Z+Z/2;x.fillStyle='#fff';x.shadowColor='#ffb347';x.shadowBlur=20;x.beginPath();x.arc(cx,cy,Z*.25,0,7);x.fill();x.shadowBlur=0;
const r=Math.max(Z*3.2,130),v=x.createRadialGradient(cx,cy,r*.15,cx,cy,r);v.addColorStop(0,'rgba(8,6,12,0)');v.addColorStop(1,'rgba(8,6,12,.97)');x.fillStyle=v;x.fillRect(0,0,520,520);
if(!fin)$('tm').textContent=Math.floor((Date.now()-t0)/1000);requestAnimationFrame(draw)}
function mvp(dx,dy){if(fin)return;const i=py*N+px,bit=dx==1?1:dx==-1?4:dy==1?2:8;if(m[i]&bit)return;px+=dx;py+=dy;trail.push([px,py]);if(px==N-1&&py==N-1){fin=1;window.Hub&&Hub.score('maze',level);setTimeout(()=>{level++;gen()},700)}}
const K={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};onkeydown=e=>{if(K[e.key]){e.preventDefault();mvp(...K[e.key])}};
let s0;c.onpointerdown=e=>s0=[e.clientX,e.clientY];c.onpointerup=e=>{if(!s0)return;const dx=e.clientX-s0[0],dy=e.clientY-s0[1];if(Math.hypot(dx,dy)>20)Math.abs(dx)>Math.abs(dy)?mvp(Math.sign(dx),0):mvp(0,Math.sign(dy));s0=null};
gen();draw();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
