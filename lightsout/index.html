<!doctype html><html lang="en"><head><script src="../settings.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lights Out</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💠</text></svg>">
<style>:root{--a:#4fd1ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1220;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#bd{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(86vw,360px);margin:0 auto 14px}.l{aspect-ratio:1;border:0;border-radius:12px;background:#1a2540;margin:0;padding:0;transition:.15s}.l.on{background:#4fd1ff;box-shadow:0 0 22px #4fd1ff}</style>
<main><h1>LIGHTS OUT</h1><p>Turn every light off. Pressing one flips it and its neighbours.</p><div id="bd"></div><p>Level <b id="lv">1</b> · Moves <b id="mv">0</b></p><p id="msg"></p><button id="nw">Reshuffle</button></main>
<script>const $=id=>document.getElementById(id);let g,mv,lv=1,done;
const press=(i,real)=>{const x=i%5,y=Math.floor(i/5);[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const u=x+a,v=y+b;if(u>=0&&v>=0&&u<5&&v<5)g[v*5+u]^=1})};
function init(){g=Array(25).fill(0);for(let k=0;k<3+lv*2;k++)press(Math.floor(Math.random()*25));if(!g.some(Boolean))press(12);mv=0;done=0;$('msg').textContent='';$('lv').textContent=lv;draw()}
function draw(){$('bd').innerHTML='';g.forEach((v,i)=>{const e=document.createElement('button');e.className='l'+(v?' on':'');e.onclick=()=>{if(done)return;press(i);mv++;draw();if(!g.some(Boolean)){done=1;$('msg').textContent='✨ Solved in '+mv+' moves!';lv++;setTimeout(init,1200)}};$('bd').append(e)});$('mv').textContent=mv}
$('nw').onclick=init;init();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
