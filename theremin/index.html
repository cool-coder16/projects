<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theremin — Play the Air</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎛️</text></svg>">
<style>:root{--a:#7affd9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0714;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:100%;height:340px;border-radius:16px;background:#05020c;touch-action:none;cursor:none;border:1px solid #7affd933}select{background:#1b1230;color:#fff;border:0;border-radius:10px;padding:8px}</style>
<main><h1>THEREMIN</h1><canvas id="c" width="640" height="340"></canvas><p>Press and move: left↔right = pitch, up↕down = volume. <b id="nt">—</b></p><select id="wv"><option>sine</option><option>triangle</option><option>sawtooth</option><option>square</option></select> <label><input type="checkbox" id="q"> Snap to notes</label></main>
<script>const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d'),NM=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];let ac,o,g,an,dn=0,mx=320,my=170,tr=[];
function f(px){const m=48+px/640*48;return 440*2**(((($('q').checked?Math.round(m):m))-69)/12)}
function start(){ac=ac||new AudioContext();o=ac.createOscillator();g=ac.createGain();an=ac.createAnalyser();an.fftSize=1024;o.type=$('wv').value;g.gain.value=0;o.connect(g);g.connect(an);an.connect(ac.destination);o.start()}
const pos=e=>{const r=c.getBoundingClientRect();mx=(e.clientX-r.left)/r.width*640;my=(e.clientY-r.top)/r.height*340};
function upd(){if(!o)return;const fr=f(mx),v=dn?Math.max(0,1-my/340)*.5:0;o.frequency.setTargetAtTime(fr,ac.currentTime,.02);g.gain.setTargetAtTime(v,ac.currentTime,.03);const m=Math.round(69+12*Math.log2(fr/440));$('nt').textContent=dn?NM[(m%12+12)%12]+Math.floor(m/12-1)+' · '+Math.round(fr)+' Hz':'—'}
c.onpointerdown=e=>{if(!o)start();o.type=$('wv').value;dn=1;pos(e);upd();c.setPointerCapture(e.pointerId)};c.onpointerup=()=>{dn=0;upd()};c.onpointermove=e=>{pos(e);upd()};$('wv').onchange=()=>o&&(o.type=$('wv').value);
(function d(){x.fillStyle='rgba(5,2,12,.25)';x.fillRect(0,0,640,340);x.strokeStyle='#ffffff10';for(let i=0;i<=48;i+=1){x.beginPath();x.moveTo(i*640/48,0);x.lineTo(i*640/48,340);x.stroke()}
const hue=mx/640*300+120;if(an&&dn){const b=new Uint8Array(an.fftSize);an.getByteTimeDomainData(b);x.strokeStyle=`hsl(${hue},100%,65%)`;x.shadowColor=x.strokeStyle;x.shadowBlur=14;x.lineWidth=3;x.beginPath();for(let i=0;i<640;i++){const v=(b[Math.floor(i*512/640)]-128)/128;i?x.lineTo(i,170+v*140):x.moveTo(i,170+v*140)}x.stroke();x.shadowBlur=0}
tr.push([mx,my]);if(tr.length>25)tr.shift();if(dn)tr.forEach(([a,b],i)=>{x.fillStyle=`hsla(${hue},100%,70%,${i/50})`;x.beginPath();x.arc(a,b,3+i*.6,0,7);x.fill()});
x.fillStyle=dn?`hsl(${hue},100%,75%)`:'#fff6';x.beginPath();x.arc(mx,my,dn?14:6,0,7);x.fill();requestAnimationFrame(d)})();</script>
</body></html>
