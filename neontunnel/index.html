<style>:root{--a:#ff4fd8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#02020a;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}

<style>body{display:block}canvas{position:fixed;inset:0}</style>
<canvas id="c"></canvas>
<script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,mx=0,my=0,t=0;const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();onresize=rs;onpointermove=e=>{mx=(e.clientX/W-.5);my=(e.clientY/H-.5)};
(function f(){t+=.012;x.fillStyle='#02020a';x.fillRect(0,0,W,H);x.lineWidth=2.5;const n=26,sides=4+Math.floor(t/4)%4;
for(let i=n;i>=0;i--){const z=((i-t*4)%n+n)%n/n,s=Math.pow(1-z,2.2),r=Math.max(W,H)*.9*(1-z)**1.6+4,cx=W/2+mx*W*.4*z,cy=H/2+my*H*.4*z;x.strokeStyle=`hsl(${(t*40+z*300)%360},100%,${40+z*30}%)`;x.shadowColor=x.strokeStyle;x.shadowBlur=14;x.globalAlpha=Math.min(1,z*3+.15);x.beginPath();for(let k=0;k<=sides;k++){const a=k/sides*6.283+t*.5+z*2;const px=cx+Math.cos(a)*r*.5,py=cy+Math.sin(a)*r*.5;k?x.lineTo(px,py):x.moveTo(px,py)}x.stroke()}x.globalAlpha=1;requestAnimationFrame(f)})();</script>
