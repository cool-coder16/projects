<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Snake</title>
<meta name="description" content="A fast neon snake game with golden bonus fruit.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27><rect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23070a14%27/><path d=%27M6 24h12V14h8V8%27 fill=%27none%27 stroke=%27%2339ff88%27 stroke-width=%275%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/><circle cx=%2726%27 cy=%278%27 r=%272.5%27 fill=%27%23ff3d71%27/></svg>">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070a14;color:#bfffd8;font-family:system-ui,sans-serif;touch-action:none}
main{text-align:center}h1{margin:0 0 6px;letter-spacing:.3em;font-weight:300;color:#39ff88;text-shadow:0 0 18px #39ff88}
.s{display:flex;justify-content:space-between;width:min(92vw,480px);margin:0 auto 10px;font-size:15px}
canvas{width:min(92vw,480px);aspect-ratio:1;border-radius:14px;border:1px solid #39ff8855;box-shadow:0 0 40px #39ff8833;background:#0a0f1e}
p{opacity:.5;font-size:13px}
</style></head><body><main>
<h1>NEON SNAKE</h1>
<div class="s"><span>Score <b id="sc">0</b></span><span>Best <b id="bs">0</b></span></div>
<canvas id="c" width="400" height="400"></canvas>
<p>Arrows / WASD / swipe · Space to start · Gold fruit = bonus, vanishes fast</p>
</main><script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=20,Z=20,$=id=>document.getElementById(id);
let sn,dir,nd,food,gold,score,speed,state='idle',timer,best=0;
try{best=+localStorage.getItem('snBest')||0}catch(e){}$('bs').textContent=best;
const rnd=()=>({x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)});
const free=()=>{let p;do p=rnd();while(sn.some(s=>s.x==p.x&&s.y==p.y));return p};
function init(){sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=nd={x:1,y:0};food=free();gold=null;score=0;speed=120;$('sc').textContent=0}
function loop(){clearInterval(timer);timer=setInterval(step,speed)}
function step(){dir=nd;const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(s=>s.x==h.x&&s.y==h.y))return over();
sn.unshift(h);let ate=0;
if(h.x==food.x&&h.y==food.y){add(10);food=free();ate=1;if(!gold&&Math.random()<.3){gold=free();gold.t=45}}
else if(gold&&h.x==gold.x&&h.y==gold.y){add(50);gold=null;ate=1}
if(!ate)sn.pop();if(gold&&--gold.t<=0)gold=null;draw()}
function add(n){score+=n;$('sc').textContent=score;if(speed>55){speed-=3;loop()}}
function over(){clearInterval(timer);state='over';if(score>best){best=score;$('bs').textContent=best;try{localStorage.setItem('snBest',best)}catch(e){}}draw()}
function cell(p,col,glow,s=1){x.shadowColor=glow||col;x.shadowBlur=12;x.fillStyle=col;const o=(1-s)*Z/2;x.beginPath();x.roundRect(p.x*Z+1+o,p.y*Z+1+o,Z-2-2*o,Z-2-2*o,5);x.fill()}
function draw(){x.shadowBlur=0;x.fillStyle='#0a0f1e';x.fillRect(0,0,400,400);x.strokeStyle='#ffffff08';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*Z,0);x.lineTo(i*Z,400);x.moveTo(0,i*Z);x.lineTo(400,i*Z);x.stroke()}
if(!sn)return;cell(food,'#ff3d71');if(gold)cell(gold,'#ffd400','#ffd400',gold.t<15&&gold.t%2?.5:1);
sn.forEach((s,i)=>cell(s,`hsl(${140-i*3},100%,${i?50:70}%)`));x.shadowBlur=0;
if(state!='play'){x.fillStyle='#070a14cc';x.fillRect(0,0,400,400);x.fillStyle='#39ff88';x.textAlign='center';x.font='bold 30px system-ui';
x.fillText(state=='over'?'GAME OVER · '+score:'READY?',200,190);x.font='15px system-ui';x.fillStyle='#bfffd8';x.fillText('Press Space or tap to '+(state=='over'?'retry':'start'),200,222)}}
function go(){if(state=='play')return;init();state='play';loop();draw()}
function turn(dx,dy){if(state!='play'){go();}if(dx&&dir.x==-dx||dy&&dir.y==-dy)return;nd={x:dx,y:dy}}
const K={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
onkeydown=e=>{if(e.code=='Space'){e.preventDefault();go()}else if(K[e.key]){e.preventDefault();turn(...K[e.key])}};
let t0;c.onpointerdown=e=>{t0=[e.clientX,e.clientY];if(state!='play')go()};
c.onpointerup=e=>{if(!t0)return;const dx=e.clientX-t0[0],dy=e.clientY-t0[1];if(Math.hypot(dx,dy)>20){Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))}t0=null};
init();draw();
</script><style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
