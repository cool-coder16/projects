<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bubble Pop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>">
<style>:root{--a:#6fd8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b2036;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(94vw,480px);border-radius:14px;background:linear-gradient(#0b2a4a,#14507a);touch-action:none;cursor:pointer;border:1px solid #ffffff22}</style>
<main><h1>BUBBLE POP</h1><canvas id="c" width="480" height="520"></canvas><p>Pop bubbles before they float away — small ones are worth more. 30 seconds!</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d');let B=[],sc=0,st='ready',t0,best=0,fx=[],left=30;
const R=(a,b)=>a+Math.random()*(b-a);
c.onpointerdown=e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*480,my=(e.clientY-r.top)/r.height*520;if(st!='play'){B=[];sc=0;st='play';t0=Date.now();return}
const i=B.map((b,i)=>[i,Math.hypot(b.x-mx,b.y-my)-b.r]).filter(a=>a[1]<0).sort((a,b)=>a[1]-b[1])[0];if(i){const b=B[i[0]];sc+=Math.round(80/b.r)*2;for(let k=0;k<8;k++)fx.push({x:b.x,y:b.y,vx:R(-3,3),vy:R(-3,3),l:1});B.splice(i[0],1)}else sc=Math.max(0,sc-2)};
(function f(){if(st=='play'){left=Math.max(0,30-(Date.now()-t0)/1000);if(left<=0){st='over';best=Math.max(best,sc);window.Hub&&Hub.score('bubblepop',sc)}if(Math.random()<.07+(30-left)*.002)B.push({x:R(30,450),y:550,r:R(14,46),v:R(.8,2.2),w:R(0,9)});B.forEach(b=>{b.y-=b.v;b.x+=Math.sin(b.y/30+b.w)*.6});B=B.filter(b=>b.y>-60)}
fx.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l-=.05});fx=fx.filter(p=>p.l>0);x.clearRect(0,0,480,520);B.forEach(b=>{const g=x.createRadialGradient(b.x-b.r*.3,b.y-b.r*.3,2,b.x,b.y,b.r);g.addColorStop(0,'#ffffffcc');g.addColorStop(1,'#6fd8ff55');x.fillStyle=g;x.strokeStyle='#bff';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.stroke()});fx.forEach(p=>{x.fillStyle=`rgba(255,255,255,${p.l})`;x.fillRect(p.x,p.y,4,4)});
x.fillStyle='#fff';x.font='bold 22px system-ui';x.textAlign='left';x.fillText('Score '+sc,14,30);x.textAlign='right';x.fillText(Math.ceil(left)+'s',466,30);
if(st!='play'){x.textAlign='center';x.fillStyle='#000a';x.fillRect(0,200,480,120);x.fillStyle='#fff';x.font='bold 30px system-ui';x.fillText(st=='over'?'Score '+sc+' · Best '+best:'Bubble Pop',240,250);x.font='16px system-ui';x.fillText('Tap to '+(st=='over'?'play again':'start'),240,285)}requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
