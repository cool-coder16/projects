<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stroop Rush</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
<style>:root{--a:#ffd23f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12141c;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#w{font-size:min(18vw,90px);font-weight:900;margin:10px 0 20px;min-height:110px;display:grid;place-items:center}#bar{height:8px;background:#ffffff22;border-radius:4px;margin:10px auto;width:80%;overflow:hidden}#bf{height:100%;background:var(--a);width:100%}.o{display:inline-block;width:42%;margin:6px;padding:18px 0;font-size:20px;background:#222838;color:#fff;border-radius:14px}</style>
<main><h1>STROOP RUSH</h1><p>Tap the <b>ink color</b> — not the word! Score <b id="sc">0</b> · Best <b id="bs">0</b></p><div id="bar"><div id="bf"></div></div><div id="w">Ready?</div><div id="b"></div><p id="msg">30 seconds. +10 for right, −5 for wrong.</p><button id="go">Start</button></main>
<script>const $=id=>document.getElementById(id),N=['RED','GREEN','BLUE','YELLOW'],C=['#ff4d5e','#2ee86a','#4da6ff','#ffd23f'];let sc,run=0,cur,t0,best=0;
N.forEach((n,i)=>{const b=document.createElement('button');b.className='o';b.textContent=n;b.onclick=()=>pick(i);$('b').append(b)});
function next(){const w=Math.floor(Math.random()*4);let k=Math.floor(Math.random()*4);if(Math.random()<.85)while(k==w)k=Math.floor(Math.random()*4);cur=k;$('w').textContent=N[w];$('w').style.color=C[k]}
function pick(i){if(!run)return;if(i==cur){sc+=10;$('msg').textContent='✓'}else{sc=Math.max(0,sc-5);$('msg').textContent='✗ it was '+N[cur]}$('sc').textContent=sc;next()}
$('go').onclick=()=>{sc=0;run=1;t0=Date.now();$('sc').textContent=0;$('go').style.display='none';$('msg').textContent='Go!';next()};
setInterval(()=>{if(!run)return;const l=Math.max(0,30-(Date.now()-t0)/1000);$('bf').style.width=l/30*100+'%';if(l<=0){run=0;best=Math.max(best,sc);$('bs').textContent=best;$('w').style.color='#fff';$('w').textContent='Time!';$('msg').textContent='Final score: '+sc;$('go').style.display='';$('go').textContent='Play again';window.Hub&&Hub.score('stroop',sc)}},100);</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
