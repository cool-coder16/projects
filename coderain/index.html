<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Rain</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟩</text></svg>">
<style>:root{--a:#2cff6d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#9fffb0;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>body{display:block}canvas{position:fixed;inset:0}#ui{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#000a;padding:10px 16px;border-radius:30px;border:1px solid #2cff6d55;z-index:2}input[type=text]{background:#031;color:#9fffb0;border:1px solid #2cff6d55;border-radius:10px;padding:8px;width:min(40vw,200px);font-size:16px}input[type=range]{accent-color:#2cff6d;width:90px}</style>
<canvas id="c"></canvas><div id="ui"><input type="text" id="msg" value="WAKE UP" maxlength="14"><input type="range" id="sp" min="1" max="10" value="5"><button id="col">Color</button></div>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,cols,drops,mask,Z=18,hue=140;const ch='ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾅﾆﾇﾈﾉ0123456789ABCDEFZ:.=*+-<>'.split('');
function setup(){W=c.width=innerWidth;H=c.height=innerHeight;cols=Math.ceil(W/Z);drops=Array.from({length:cols},()=>Math.random()*-50);const o=document.createElement('canvas');o.width=cols;o.height=Math.ceil(H/Z);const q=o.getContext('2d');q.fillStyle='#fff';q.textAlign='center';q.textBaseline='middle';const t=$('msg').value.toUpperCase();q.font=`bold ${Math.min(o.height*.5,o.width/(t.length*.7||1))}px system-ui`;q.fillText(t,o.width/2,o.height/2);mask=q.getImageData(0,0,o.width,o.height).data;mw=o.width}let mw;
$('msg').oninput=setup;onresize=setup;$('col').onclick=()=>{hue=(hue+70)%360};setup();
(function f(){x.fillStyle='rgba(0,0,0,.09)';x.fillRect(0,0,W,H);x.font=Z+'px monospace';const sp=$('sp').value/5;
for(let i=0;i<cols;i++){const y=Math.floor(drops[i]);const lit=y>=0&&mask[(y*mw+i)*4+3]>128;x.fillStyle=lit?'#fff':`hsl(${hue},100%,${60+Math.random()*20}%)`;if(lit){x.shadowColor='#fff';x.shadowBlur=14}x.fillText(ch[Math.random()*ch.length|0],i*Z,y*Z);x.shadowBlur=0;
drops[i]+=sp*(.5+(i%7)/10);if(drops[i]*Z>H&&Math.random()>.975)drops[i]=Math.random()*-20}requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
