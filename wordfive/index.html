<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Five</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔤</text></svg>">
<style>:root{--a:#6aaa64}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#121213;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#bd{display:grid;gap:6px;justify-content:center;margin-bottom:14px}.row{display:flex;gap:6px;justify-content:center}.t{width:min(15vw,58px);aspect-ratio:1;border:2px solid #3a3a3c;display:grid;place-items:center;font-size:28px;font-weight:800;text-transform:uppercase;transition:.3s}.t.f{border-color:#888}.t.G{background:#538d4e;border-color:#538d4e}.t.Y{background:#b59f3b;border-color:#b59f3b}.t.X{background:#3a3a3c;border-color:#3a3a3c}
#kb button{background:#818384;color:#fff;padding:12px 0;width:min(7.6vw,40px);margin:2px;border-radius:6px;font-size:14px}#kb button.G{background:#538d4e}#kb button.Y{background:#b59f3b}#kb button.X{background:#3a3a3c}#kb .wd{width:min(14vw,66px)}</style>
<main><h1>WORD FIVE</h1><div id="bd"></div><p id="msg">Guess the 5-letter word in 6 tries.</p><div id="kb"></div><button id="nw">New word</button></main>
<script>const $=id=>document.getElementById(id),WS='about alert brave candy dance eagle flame ghost heart image jolly knife lemon magic night ocean piano queen robot smile tiger uncle voice water young zebra beach cloud dream earth fresh grape happy juice light money north olive plant quick river stone table under vivid world yacht pearl sweet crown dozen flute globe habit ivory jelly koala lunar mango noble orbit pride quiet raven solar trick unity vapor wheel amber blaze charm drift ember frost glide honey input jewel kayak laser marsh nerve pixel quota radar spark thumb urban vigor windy zesty'.split(' ');
let w,row,cur,done;const rows=[];
for(let r=0;r<6;r++){const d=document.createElement('div');d.className='row';for(let i=0;i<5;i++)d.append(Object.assign(document.createElement('div'),{className:'t'}));$('bd').append(d);rows.push(d)}
['qwertyuiop','asdfghjkl','⏎zxcvbnm⌫'].forEach(s=>{const d=document.createElement('div');[...s].forEach(k=>{const b=document.createElement('button');b.textContent=k;b.dataset.k=k;if('⏎⌫'.includes(k))b.className='wd';b.onclick=()=>key(k);d.append(b)});$('kb').append(d)});
function init(){w=WS[Math.floor(Math.random()*WS.length)];row=0;cur='';done=0;rows.forEach(r=>[...r.children].forEach(t=>{t.textContent='';t.className='t'}));[...document.querySelectorAll('#kb button')].forEach(b=>b.className=b.className.replace(/[GYX]/g,'').trim());$('msg').textContent='Guess the 5-letter word in 6 tries.'}
function paint(){[...rows[row].children].forEach((t,i)=>{t.textContent=cur[i]||'';t.className='t'+(cur[i]?' f':'')})}
function key(k){if(done)return;if(k=='⌫'||k=='Backspace')cur=cur.slice(0,-1);else if(k=='⏎'||k=='Enter'){if(cur.length<5){$('msg').textContent='Need 5 letters!';return}submit();return}else if(/^[a-z]$/.test(k)&&cur.length<5)cur+=k;paint()}
function submit(){const res=Array(5).fill('X'),left=[...w];for(let i=0;i<5;i++)if(cur[i]==w[i]){res[i]='G';left[i]=null}
for(let i=0;i<5;i++)if(res[i]=='X'){const j=left.indexOf(cur[i]);if(j>=0){res[i]='Y';left[j]=null}}
[...rows[row].children].forEach((t,i)=>{t.className='t '+res[i];const b=document.querySelector(`#kb [data-k=${cur[i]}]`),o={G:3,Y:2,X:1};const p=b.className.match(/[GYX]/);if(!p||o[res[i]]>o[p[0]])b.className=res[i]});
if(cur==w){done=1;$('msg').textContent='🎉 You got it in '+(row+1)+'!'}else if(++row==6){done=1;$('msg').textContent='The word was '+w.toUpperCase()}else{cur='';$('msg').textContent=''}}
onkeydown=e=>{if(!e.metaKey&&!e.ctrlKey)key(e.key.length==1?e.key.toLowerCase():e.key)};$('nw').onclick=init;init();</script>
</body></html>
