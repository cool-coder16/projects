<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
<style>body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#1b2440,#0a0d16 60%);color:#e6edf3;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:60px 16px}
main{width:min(94vw,440px)}h1{font-weight:200;letter-spacing:.35em;text-align:center;margin:0 0 20px}.card{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:16px;padding:20px}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{flex:1;background:#ffffff14;color:#fff;border:0;border-radius:10px;padding:9px;cursor:pointer;font-weight:600}.tabs button.s{background:#7ee0ff;color:#000}
label{display:block;font-size:13px;opacity:.75;margin:12px 0 4px}input{width:100%;box-sizing:border-box;background:#0a0d16;color:#fff;border:1px solid #ffffff2a;border-radius:10px;padding:11px;font-size:16px}
.go{width:100%;margin-top:16px;background:#7ee0ff;color:#000;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:16px;cursor:pointer}.go:disabled{opacity:.5}
#msg{min-height:20px;margin-top:12px;font-size:14px}#msg.e{color:#ff7a8a}#msg.o{color:#6dff9a}small{opacity:.6;display:block;margin-top:6px}
table{width:100%;border-collapse:collapse;margin:12px 0}td{padding:8px 4px;border-bottom:1px solid #ffffff14}td:last-child{text-align:right;font-weight:700;color:#7ee0ff}
#pbar{position:fixed;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between}#pbar a{color:#fff;text-decoration:none;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;font:600 14px system-ui}</style></head><body>
<div id="pbar"><a href="../">Projects</a><a href="../">🏠</a></div>
<main><h1>ACCOUNT</h1><div class="card" id="c">Loading…</div></main>
<script>
const $=id=>document.getElementById(id),UN=/^[a-z0-9_]{3,20}$/;
let A,D,tab='login';
const say=(t,k)=>{$('msg').textContent=t;$('msg').className=k||''};
const ERR={'auth/email-already-in-use':'That email already has an account.','auth/invalid-email':'That email looks invalid.','auth/weak-password':'Password must be at least 6 characters.','auth/network-request-failed':'Network problem — try again.','auth/too-many-requests':'Too many tries — wait a bit.'};
const lookup=async u=>{const d=await D.collection('usernames').doc(u).get();return d.exists?d.data():null};
function out(){$('c').innerHTML=`<div class="tabs"><button data-t="login">Log in</button><button data-t="signup">Sign up</button><button data-t="forgot">Forgot</button></div><form id="f"></form><div id="msg"></div>`;
 document.querySelectorAll('.tabs button').forEach(b=>{b.className=b.dataset.t==tab?'s':'';b.onclick=()=>{tab=b.dataset.t;out()}});
 const F={login:[['u','Username','text'],['p','Password','password']],signup:[['u','Username (3–20 letters, numbers, _)','text'],['e','Email (used only for password reset)','email'],['p','Password (6+ characters)','password']],forgot:[['u','Your username','text']]}[tab];
 $('f').innerHTML=F.map(([id,l,t])=>`<label>${l}</label><input id="${id}" type="${t}" autocomplete="${id=='p'?(tab=='signup'?'new-password':'current-password'):id=='e'?'email':'username'}" required>`).join('')+`<button class="go" id="go">${{login:'Log in',signup:'Create account',forgot:'Email me a reset link'}[tab]}</button><small>${tab=='signup'?'Your scores are saved to your account. Only your username, email and best scores are stored.':''}</small>`;
 $('f').onsubmit=async e=>{e.preventDefault();$('go').disabled=true;say('Working…');try{await act()}catch(x){say(ERR[x.code]||(x.code=='auth/invalid-credential'||x.code=='auth/user-not-found'||x.code=='auth/wrong-password'?'Wrong username or password.':x.message||'Something went wrong'),'e')}$('go').disabled=false}}
async function act(){const u=($('u').value||'').trim().toLowerCase();
 if(tab=='signup'){if(!UN.test(u))return say('Username must be 3–20 characters: a–z, 0–9 or _','e');if(await lookup(u))return say('That username is taken','e');
  const c=await A.createUserWithEmailAndPassword($('e').value.trim(),$('p').value);
  try{await D.collection('usernames').doc(u).set({uid:c.user.uid,email:c.user.email,username:u});await c.user.updateProfile({displayName:u})}catch(x){await c.user.delete();return say('That username was just taken — try another','e')}
  Hub.wr('hubUser',{username:u});Hub.badge();await Hub.sync();return inn(A.currentUser)}
 if(tab=='login'){const d=await lookup(u);if(!d)return say('Wrong username or password.','e');await A.signInWithEmailAndPassword(d.email,$('p').value);Hub.wr('hubUser',{username:u});Hub.badge();await Hub.sync();return inn(A.currentUser)}
 const d=await lookup(u);if(d)await A.sendPasswordResetEmail(d.email);say('If that username exists, a reset link was sent to the email on file. Check your inbox (and spam).','o')}
async function inn(u){$('c').innerHTML='Loading your scores…';let s=Hub.rd('hubScores')||{};try{s=(await Hub.sync())||s}catch(e){}
 const rows=Object.entries(s).map(([g,x])=>`<tr><td></td><td>${x.v}</td></tr>`).join('');
 $('c').innerHTML=`<div style="font-size:20px">👋 Hi, <b id="nm"></b></div><small id="em"></small><h3 style="margin:18px 0 0;font-weight:600">Your best scores</h3><table id="t">${rows||'<tr><td colspan=2 style="text-align:left;color:inherit;font-weight:400">No scores yet — go play something!</td></tr>'}</table><button class="go" id="so" style="background:#ffffff22;color:#fff">Log out</button>`;
 $('nm').textContent=u.displayName||'';$('em').textContent=u.email||'';[...$('t').rows].forEach((r,i)=>{const e=Object.keys(s)[i];if(e){const G=Hub.GAMES[e];r.cells[0].textContent=G?G.name:e;if(G)r.cells[1].textContent=s[e].v+' '+G.unit}});
 $('so').onclick=async()=>{await A.signOut()}}
(async()=>{try{({auth:A,db:D}=await Hub.load())}catch(e){$('c').textContent='Could not load the account service (blocked or offline).';return}
 A.onAuthStateChanged(u=>{if(u&&u.displayName){Hub.wr('hubUser',{username:u.displayName});Hub.badge();inn(u)}else if(!u){try{localStorage.removeItem('hubUser')}catch(e){}Hub.badge();out()}})})();
</script></body></html>
