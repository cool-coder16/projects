<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terrain Maker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
<style>:root{--a:#6fd0ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e1a24;color:#e6f4ff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(98vw,720px);image-rendering:auto;border-radius:14px;border:1px solid #ffffff22}.r{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:14px;margin:8px 0}input{accent-color:#6fd0ff}</style>
<main><h1>TERRAIN MAKER</h1><canvas id="c" width="240" height="150"></canvas><div class="r">Scale <input id="sc" type="range" min="3" max="20" value="8"> Water <input id="wt" type="range" min="10" max="70" value="38"> Relief <input id="rl" type="range" min="1" max="12" value="6"> <button id="rn">🎲 New world</button></div><p>Generated from fractal noise — rivers of water, sand, forest, rock and snow.</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),W=240,H=150,img=x.createImageData(W,H),$=id=>document.getElementById(id);let seed=Math.random()*100;
const rnd=(a,b)=>{const n=Math.sin((a+seed)*127.1+(b+seed*1.7)*311.7)*43758.5453;return n-Math.floor(n)},sm=t=>t*t*(3-2*t);
function vn(px,py){const xi=Math.floor(px),yi=Math.floor(py),xf=sm(px-xi),yf=sm(py-yi),a=rnd(xi,yi),b=rnd(xi+1,yi),cc=rnd(xi,yi+1),d=rnd(xi+1,yi+1);return a+(b-a)*xf+(cc-a)*yf+(a-b-cc+d)*xf*yf}
function hgt(i,j,s){let h=0,amp=1,f=1,tot=0;for(let o=0;o<5;o++){h+=vn(i/W*s*f+o*7,j/H*s*f*(W/H)/ (W/H)+o*3)*amp;tot+=amp;amp*=.5;f*=2}return h/tot}
function draw(){const s=+$('sc').value/2,wl=+$('wt').value/100,rl=+$('rl').value;let p=0;for(let j=0;j<H;j++)for(let i=0;i<W;i++){const h=hgt(i,j,s),sh=(hgt(i-1,j-1,s)-hgt(i+1,j+1,s))*rl*8+1;let col;
if(h<wl)col=[20+h/wl*40,70+h/wl*60,150+h/wl*70];else if(h<wl+.03)col=[225,210,150];else if(h<wl+.2)col=[60,140-(h-wl)*80,60];else if(h<wl+.33)col=[120,110,100];else col=[245,248,255];
const k=h<wl?1:Math.max(.55,Math.min(1.4,sh));img.data[p++]=col[0]*k;img.data[p++]=col[1]*k;img.data[p++]=col[2]*k;img.data[p++]=255}x.putImageData(img,0,0)}
['sc','wt','rl'].forEach(i=>$(i).oninput=draw);$('rn').onclick=()=>{seed=Math.random()*100;draw()};draw();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
