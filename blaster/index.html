<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Blaster</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>:root{--a:#5af}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05060f;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(94vw,480px);border-radius:12px;background:#02030a;touch-action:none;cursor:none;border:1px solid #55aaff44}</style>
<main><h1>STAR BLASTER</h1><canvas id="c" width="480" height="640"></canvas><p>Move with mouse / finger — your ship fires automatically. Grab 🔷 for triple shot.</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d');let sx=240,sy=560,tx=240,ty=560,bl=[],as=[],pu=[],ex=[],sc=0,lives=3,st='ready',best=0,t=0,inv=0,tri=0,wave=1,stars=Array.from({length:70},()=>[Math.random()*480,Math.random()*640,Math.random()*2+.5]);
const pt=e=>{const r=c.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*480;ty=Math.min(610,Math.max(300,(e.clientY-r.top)/r.height*640-40))};
c.onpointermove=pt;c.onpointerdown=e=>{pt(e);if(st!='play'){st='play';bl=[];as=[];pu=[];sc=0;lives=3;wave=1;t=0;tri=0}};
const R=(a,b)=>a+Math.random()*(b-a),rad=s=>[0,14,26,40][s];
function ast(px,py,s){const a=[];for(let i=0;i<9;i++)a.push(rad(s)*R(.75,1.15));as.push({x:px,y:py,s,vx:R(-1.2,1.2),vy:R(.8,2)+wave*.15,a,r:R(0,6),vr:R(-.03,.03)})}
function boom(px,py,n=12){for(let i=0;i<n;i++)ex.push({x:px,y:py,vx:R(-4,4),vy:R(-4,4),l:1})}
function step(){stars.forEach(s=>{s[1]+=s[2];if(s[1]>640)s[1]=0});sx+=(tx-sx)*.25;sy+=(ty-sy)*.25;ex.forEach(e=>{e.x+=e.vx;e.y+=e.vy;e.l-=.03});ex=ex.filter(e=>e.l>0);if(st!='play')return;t++;if(inv>0)inv--;if(tri>0)tri--;
if(t%8==0){bl.push({x:sx,y:sy-20,vx:0});if(tri){bl.push({x:sx-10,y:sy-14,vx:-1.5});bl.push({x:sx+10,y:sy-14,vx:1.5})}}
if(t%Math.max(25,80-wave*6)==0)ast(R(30,450),-50,Math.random()<.5?3:2);if(t%900==0)wave++;
bl.forEach(b=>{b.y-=11;b.x+=b.vx});bl=bl.filter(b=>b.y>-20);as.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.r+=a.vr;if(a.x<-60||a.x>540)a.vx*=-1});pu.forEach(p=>p.y+=2);
for(const a of as){for(const b of bl){if(!b.d&&Math.hypot(a.x-b.x,a.y-b.y)<rad(a.s)){b.d=1;a.h=1;boom(b.x,b.y,4)}}
if(a.h){sc+=a.s*10;boom(a.x,a.y,10+a.s*4);if(a.s>1){ast(a.x,a.y,a.s-1);ast(a.x,a.y,a.s-1)}if(Math.random()<.12)pu.push({x:a.x,y:a.y})}
if(!inv&&Math.hypot(a.x-sx,a.y-sy)<rad(a.s)+10){a.h=1;lives--;inv=100;boom(sx,sy,30);if(lives<=0){st='over';best=Math.max(best,sc);window.Hub&&Hub.score('blaster',sc)}}}
as=as.filter(a=>!a.h&&a.y<700);bl=bl.filter(b=>!b.d);pu=pu.filter(p=>{if(Math.hypot(p.x-sx,p.y-sy)<24){tri=600;sc+=25;return false}return p.y<660})}
(function f(){step();x.fillStyle='#02030a';x.fillRect(0,0,480,640);x.fillStyle='#fff';stars.forEach(s=>{x.globalAlpha=s[2]/3;x.fillRect(s[0],s[1],s[2],s[2])});x.globalAlpha=1;
as.forEach(a=>{x.save();x.translate(a.x,a.y);x.rotate(a.r);x.strokeStyle='#cfd8ff';x.fillStyle='#1a1f36';x.lineWidth=2;x.beginPath();a.a.forEach((r,i)=>{const an=i/9*6.283;i?x.lineTo(Math.cos(an)*r,Math.sin(an)*r):x.moveTo(Math.cos(an)*r,Math.sin(an)*r)});x.closePath();x.fill();x.stroke();x.restore()});
x.fillStyle='#ffe14d';x.shadowColor='#ffe14d';x.shadowBlur=10;bl.forEach(b=>x.fillRect(b.x-2,b.y-8,4,12));x.shadowBlur=0;pu.forEach(p=>{x.font='22px system-ui';x.textAlign='center';x.fillText('🔷',p.x,p.y)});
ex.forEach(e=>{x.fillStyle=`rgba(255,${150+e.l*100|0},60,${e.l})`;x.fillRect(e.x,e.y,4,4)});
if(st!='over'&&(inv%10<6)){x.save();x.translate(sx,sy);x.fillStyle='#5af';x.shadowColor='#5af';x.shadowBlur=16;x.beginPath();x.moveTo(0,-22);x.lineTo(16,16);x.lineTo(0,9);x.lineTo(-16,16);x.closePath();x.fill();x.fillStyle='#ff9f43';x.beginPath();x.moveTo(-5,12);x.lineTo(0,18+Math.random()*10);x.lineTo(5,12);x.fill();x.restore()}
x.fillStyle='#fff';x.font='bold 18px system-ui';x.textAlign='left';x.fillText('Score '+sc,12,28);x.textAlign='right';x.fillText('♥'.repeat(lives)+' Wave '+wave,468,28);
if(st!='play'){x.textAlign='center';x.fillStyle='#000a';x.fillRect(0,230,480,140);x.fillStyle='#fff';x.font='bold 30px system-ui';x.fillText(st=='over'?'Game over · '+sc:'Star Blaster',240,290);x.font='16px system-ui';x.fillText((st=='over'?'Best '+best+' — ':'')+'Tap to '+(st=='over'?'retry':'launch'),240,325)}requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
