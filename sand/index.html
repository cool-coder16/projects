<!doctype html><html lang="en"><head><script src="../settings.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Falling Sand</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏳</text></svg>">
<style>:root{--a:#f6c453}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0c12;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>canvas{width:min(96vw,640px);border-radius:12px;image-rendering:pixelated;touch-action:none;cursor:crosshair;border:1px solid #ffffff22}.m{background:#222a3a;color:#fff}.m.s{background:var(--a);color:#000}input{accent-color:#f6c453}</style>
<main><h1>FALLING SAND</h1><canvas id="c" width="160" height="100"></canvas><div id="b"></div><p>Brush <input id="br" type="range" min="1" max="6" value="3"> · Draw with mouse or finger</p></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),W=160,H=100,img=x.createImageData(W,H),g=new Uint8Array(W*H),v=new Uint8Array(W*H);let mat=1,dn=0;
const M=[['Sand',1],['Water',2],['Wall',3],['Erase',0]];M.forEach(([n,k],i)=>{const b=document.createElement('button');b.className='m'+(i?'':' s');b.textContent=n;b.onclick=()=>{mat=k;[...document.getElementById('b').children].forEach(e=>e.classList.toggle('s',e==b))};document.getElementById('b').append(b)});
document.getElementById('b').append(Object.assign(document.createElement('button'),{className:'m',textContent:'Clear',onclick:()=>g.fill(0)}));
const put=e=>{const r=c.getBoundingClientRect(),cx=Math.floor((e.clientX-r.left)/r.width*W),cy=Math.floor((e.clientY-r.top)/r.height*H),s=+document.getElementById('br').value;
for(let dy=-s;dy<=s;dy++)for(let dx=-s;dx<=s;dx++){const a=cx+dx,b=cy+dy;if(a>=0&&b>=0&&a<W&&b<H&&dx*dx+dy*dy<=s*s&&(mat==0||!g[b*W+a]||Math.random()<.2)){g[b*W+a]=mat;v[b*W+a]=Math.random()*40}}};
c.onpointerdown=e=>{dn=1;put(e);c.setPointerCapture(e.pointerId)};c.onpointerup=()=>dn=0;c.onpointermove=e=>{if(dn)put(e)};
const sw=(a,b)=>{[g[a],g[b]]=[g[b],g[a]];[v[a],v[b]]=[v[b],v[a]]};
(function f(){if(dn&&0){}for(let y=H-2;y>=0;y--){const dir=Math.random()<.5;for(let k=0;k<W;k++){const i=dir?k:W-1-k,p=y*W+i,t=g[p];if(!t||t==3)continue;const d=p+W,l=i>0,r=i<W-1;
if(t==1){if(!g[d]||g[d]==2)sw(p,d);else{const a=Math.random()<.5?-1:1;if(i+a>=0&&i+a<W&&(!g[d+a]||g[d+a]==2))sw(p,d+a)}}
else if(t==2){if(!g[d])sw(p,d);else{const a=Math.random()<.5?-1:1;if(i+a>=0&&i+a<W&&!g[d+a])sw(p,d+a);else if(i+a>=0&&i+a<W&&!g[p+a])sw(p,p+a)}}}}
for(let p=0;p<W*H;p++){const t=g[p],q=p*4;let r=6,gg=7,b=14;if(t==1){r=230-v[p];gg=190-v[p];b=90}else if(t==2){r=40;gg=110+v[p];b=230}else if(t==3){r=110;gg=115;b=130}img.data[q]=r;img.data[q+1]=gg;img.data[q+2]=b;img.data[q+3]=255}x.putImageData(img,0,0);requestAnimationFrame(f)})();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
