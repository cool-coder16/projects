<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geo Quiz</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<style>:root{--a:#4dd0ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1626;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#fl{font-size:90px;line-height:1.2}#q{font-size:22px;margin:8px 0 16px}.o{display:block;width:100%;background:#16263f;color:#fff;border-radius:14px;padding:14px;margin:8px 0;font-size:17px;text-align:center}.o.ok{background:#1f9d55}.o.no{background:#c0392b}.tb button{background:#16263f;color:#fff}.tb button.s{background:var(--a);color:#000}</style>
<main><h1>GEO QUIZ</h1><div class="tb"><button id="m1" class="s">Capitals</button><button id="m2">Flags</button></div><p>Question <b id="n">1</b>/10 · Score <b id="sc">0</b> · Best <b id="bs">0</b></p><div id="fl"></div><div id="q"></div><div id="o"></div><button id="nx" style="display:none">Next ➜</button></main>
<script>const $=id=>document.getElementById(id),D='France|Paris|🇫🇷;Japan|Tokyo|🇯🇵;Brazil|Brasília|🇧🇷;Canada|Ottawa|🇨🇦;Australia|Canberra|🇦🇺;Egypt|Cairo|🇪🇬;India|New Delhi|🇮🇳;Italy|Rome|🇮🇹;Germany|Berlin|🇩🇪;Spain|Madrid|🇪🇸;Mexico|Mexico City|🇲🇽;Argentina|Buenos Aires|🇦🇷;China|Beijing|🇨🇳;Russia|Moscow|🇷🇺;Turkey|Ankara|🇹🇷;Kenya|Nairobi|🇰🇪;Nigeria|Abuja|🇳🇬;South Africa|Pretoria|🇿🇦;Thailand|Bangkok|🇹🇭;Vietnam|Hanoi|🇻🇳;Indonesia|Jakarta|🇮🇩;South Korea|Seoul|🇰🇷;Greece|Athens|🇬🇷;Portugal|Lisbon|🇵🇹;Sweden|Stockholm|🇸🇪;Norway|Oslo|🇳🇴;Poland|Warsaw|🇵🇱;Peru|Lima|🇵🇪;Chile|Santiago|🇨🇱;Colombia|Bogotá|🇨🇴;Cuba|Havana|🇨🇺;Ireland|Dublin|🇮🇪;Switzerland|Bern|🇨🇭;Austria|Vienna|🇦🇹;Morocco|Rabat|🇲🇦;Saudi Arabia|Riyadh|🇸🇦;Pakistan|Islamabad|🇵🇰;Philippines|Manila|🇵🇭;New Zealand|Wellington|🇳🇿;Ukraine|Kyiv|🇺🇦'.split(';').map(s=>s.split('|'));
let mode=0,n,sc,cur,locked,best=0,deck=[];const sh=a=>[...a].sort(()=>Math.random()-.5);
function init(){n=0;sc=0;deck=sh(D);next()}
function next(){if(n==10){$('fl').textContent='🏁';$('q').textContent=`Finished! You scored ${sc}/10`;$('o').innerHTML='';best=Math.max(best,sc);window.Hub&&Hub.score('geoquiz',sc);$('bs').textContent=best;$('nx').textContent='Play again';$('nx').style.display='';n=11;return}
n++;locked=0;$('n').textContent=n;$('sc').textContent=sc;$('nx').style.display='none';$('nx').textContent='Next ➜';cur=deck.pop();const wr=sh(D.filter(d=>d!=cur)).slice(0,3),opts=sh([cur,...wr]);
$('fl').textContent=mode?cur[2]:'🏛️';$('q').textContent=mode?'Which country has this flag?':`What is the capital of ${cur[0]}?`;$('o').innerHTML='';
opts.forEach(o=>{const b=document.createElement('button');b.className='o';b.textContent=mode?o[0]:o[1];b.onclick=()=>{if(locked)return;locked=1;const ok=o==cur;if(ok)sc++;b.classList.add(ok?'ok':'no');[...$('o').children].forEach(e=>{if(e.textContent==(mode?cur[0]:cur[1]))e.classList.add('ok')});$('sc').textContent=sc;$('nx').style.display=''};$('o').append(b)})}
$('nx').onclick=()=>n>10?init():next();
['m1','m2'].forEach((id,i)=>$(id).onclick=()=>{mode=i;$('m1').className=i?'':'s';$('m2').className=i?'s':'';init()});init();</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
