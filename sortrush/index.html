<!doctype html><html lang="en"><head><script src="../settings.js"></script><script src="../hub.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sort Rush</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<style>:root{--a:#6fd0ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14181f;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#it{font-size:min(30vw,130px);margin:8px;height:150px;display:grid;place-items:center}.d{width:44%;margin:4px;padding:16px 0;font-size:18px}</style>
<main><h1>SORT RUSH</h1><p>Score <b id="s">0</b> · Time <b id="t">30</b> · Best <b id="b">0</b></p><div id="it">🍎</div><div><button class="d" id="l">← Fruit</button><button class="d" id="r">Vegetable →</button></div><p id="m">Sort each item with ← / → or the buttons. +10 right, −5 wrong. Start by pressing either.</p></main>
<script>const $=id=>document.getElementById(id),FR='🍎🍊🍋🍌🍉🍇🍓🍑🍒🍍🥭🍐'.match(/./gu),VG='🥕🥦🌽🥔🍆🥬🧅🧄🍅🫑🥒🍄'.match(/./gu);let s=0,run=0,t0,cur,best=0;
function nx(){const f=Math.random()<.5;cur=f?0:1;const a=f?FR:VG;$('it').textContent=a[Math.floor(Math.random()*a.length)]}
function p(k){if(!run){run=1;s=0;t0=Date.now();$('s').textContent=0;nx();return}if(k==cur)s+=10;else s=Math.max(0,s-5);$('s').textContent=s;nx()}
onkeydown=e=>{if(e.key=='ArrowLeft'){e.preventDefault();p(0)}if(e.key=='ArrowRight'){e.preventDefault();p(1)}};$('l').onclick=()=>p(0);$('r').onclick=()=>p(1);
setInterval(()=>{if(!run)return;const l=Math.max(0,30-(Date.now()-t0)/1000);$('t').textContent=Math.ceil(l);if(l<=0){run=0;best=Math.max(best,s);$('b').textContent=best;$('it').textContent='⏱';$('m').textContent='Time! Final score '+s+'. Press a button to play again.';window.Hub&&Hub.score('sortrush',s)}},100);</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
