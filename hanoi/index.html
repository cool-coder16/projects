<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tower of Hanoi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗼</text></svg>">
<style>:root{--a:#ffb454}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1a1423;color:#fff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#pg{display:flex;gap:10px;justify-content:center;margin:10px 0}.pg{flex:1;height:260px;background:#261c34;border-radius:14px;display:flex;flex-direction:column-reverse;align-items:center;padding:8px 0;position:relative;cursor:pointer}.pg:before{content:'';position:absolute;bottom:8px;top:30px;width:8px;background:#4a3a63;border-radius:4px}.pg.s{outline:3px solid var(--a)}.d{height:22px;border-radius:11px;margin-top:3px;position:relative;z-index:1;transition:.15s}.d.up{transform:translateY(-14px)}select{background:#33264a;color:#fff;border:0;padding:8px;border-radius:10px}</style>
<main><h1>HANOI</h1><p>Move the whole stack to the right peg. Only smaller discs go on bigger ones.</p><div id="pg"></div><p>Discs <select id="n"></select> · Moves <b id="mv">0</b> / best possible <b id="bs">7</b></p><p id="msg"></p><button id="sv">✨ Show me how (auto-solve)</button><button id="rs">Reset</button></main>
<script>const $=id=>document.getElementById(id);let p,sel=null,mv,n,busy=0;for(let i=3;i<=7;i++)$('n').append(new Option(i+' discs',i));
function init(){busy=0;n=+$('n').value||3;p=[[...Array(n).keys()].map(i=>n-i),[],[]];mv=0;sel=null;$('bs').textContent=2**n-1;$('msg').textContent='';draw()}
function draw(){$('mv').textContent=mv;$('pg').innerHTML='';p.forEach((s,i)=>{const e=document.createElement('div');e.className='pg'+(sel===i?' s':'');s.forEach((d,k)=>{const x=document.createElement('div');x.className='d'+(sel===i&&k==s.length-1?' up':'');x.style.width=(24+d*(60/n*1.1))+'%';x.style.background=`hsl(${d*360/n},80%,60%)`;e.append(x)});e.onclick=()=>pick(i);$('pg').append(e)})}
function pick(i){if(busy)return;if(sel===null){if(p[i].length)sel=i}else{if(sel!=i&&(!p[i].length||p[i].at(-1)>p[sel].at(-1)))go(sel,i);sel=null}draw();if(p[2].length==n){$('msg').textContent=mv==2**n-1?'🏆 Perfect! Minimum moves!':'✅ Solved in '+mv+' moves. Can you do '+(2**n-1)+'?'}}
function go(a,b){p[b].push(p[a].pop());mv++}
$('sv').onclick=async()=>{init();busy=1;const ms=[];(function h(k,a,b,c){if(!k)return;h(k-1,a,c,b);ms.push([a,b]);h(k-1,c,b,a)})(n,0,2,1);for(const[a,b]of ms){await new Promise(r=>setTimeout(r,450));if(!busy)return;go(a,b);draw()}busy=0;$('msg').textContent='Recursion solves it in '+ms.length+' moves — the perfect minimum!'};
$('rs').onclick=init;$('n').onchange=init;init();</script>
</body></html>
