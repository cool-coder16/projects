<!doctype html><html lang="en"><head><script src="../settings.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breathe — Calm Guide</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>">
<style>:root{--a:#7fd8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1b2b;color:#dff6ff;font-family:system-ui,sans-serif;user-select:none}
main{text-align:center;padding:16px;width:min(94vw,640px)}h1{margin:0 0 14px;letter-spacing:.25em;font-weight:300;color:var(--a);text-shadow:0 0 18px var(--a)}
button{background:var(--a);color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer;margin:4px}p{opacity:.7}</style></head><body>
<style>#o{width:min(70vw,320px);aspect-ratio:1;margin:10px auto 20px;display:grid;place-items:center;position:relative}#c{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#bff0ffcc,#4aa8d888 60%,#2b6cb033);box-shadow:0 0 80px #7fd8ff88;transform:scale(.4)}#t{position:relative;font-size:22px;font-weight:300;letter-spacing:.1em}button{background:#ffffff22;color:#fff}button.on{background:var(--a);color:#000}</style>
<main><h1>BREATHE</h1><div id="o"><div id="c"></div><div id="t"></div></div><button id="m1" class="on">Calm 4·4·6</button><button id="m2">Box 4·4·4·4</button><p>Breaths: <b id="n">0</b> · follow the circle</p></main>
<script>const $=id=>document.getElementById(id),M={m1:[4,4,6,0],m2:[4,4,4,4]},N=['Breathe in','Hold','Breathe out','Hold'];let m='m1',t0=performance.now(),last=0;
for(const k in M)$(k).onclick=()=>{m=k;t0=performance.now();$('m1').className=k=='m1'?'on':'';$('m2').className=k=='m2'?'on':''};
(function f(now){const a=M[m],tot=a.reduce((x,y)=>x+y);let t=((now-t0)/1000)%tot,i=0;for(;i<4;i++){if(!a[i])continue;if(t<a[i])break;t-=a[i]}
const q=t/a[i],e=(1-Math.cos(Math.PI*q))/2,s=[.4+.6*e,1,1-.6*e,.4][i];$('c').style.transform=`scale(${s})`;$('t').innerHTML=N[i]+'<br>'+Math.ceil(a[i]-t);
const br=Math.floor((now-t0)/1000/tot);if(br!=last){last=br;$('n').textContent=br}requestAnimationFrame(f)})(performance.now());</script>
<style>#pbar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:99999;pointer-events:none}#pbar a{pointer-events:auto;color:#fff;text-decoration:none;font:600 14px system-ui;background:#000a;padding:6px 12px;border-radius:16px;border:1px solid #fff3;backdrop-filter:blur(6px)}#pbar a:hover{background:#000d}</style><div id="pbar"><a href="../">Projects</a><a href="../" title="Home" aria-label="Home">🏠</a></div></body></html>
